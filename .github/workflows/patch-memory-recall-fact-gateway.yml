name: Patch Memory Recall Fact Gateway

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-memory-recall-fact-gateway.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Patch memory recall fact gateway
        run: python scripts/patch_memory_recall_fact_gateway.py
      - name: Syntax check worker
        run: node --check victor-telegram-worker/worker.js
      - name: Run Memory Brain tests
        run: node --test victor-telegram-worker/memory_brain.test.mjs victor-telegram-worker/cognee_memory_bridge.test.mjs
      - name: Verify fact gateway contains semantic recall
        run: |
          grep -q "semanticMemory = await recallVictorMemory" victor-telegram-worker/worker.js
          grep -q "COGNEE LONG-TERM MEMORY" victor-telegram-worker/worker.js
      - name: Persist patch if changed
        run: |
          git config user.name "victor-governed-runtime"
          git config user.email "actions@users.noreply.github.com"
          git add victor-telegram-worker/worker.js
          git diff --cached --quiet && exit 0
          git commit -m "runtime: route fact gateway through semantic memory recall"
          git pull --rebase --autostash
          git push
