name: Step 9 Pin Remaining GitHub Actions

on:
  push:
    branches: [main]
    paths:
      - 'scripts/pin_github_actions_refs.py'
      - '.github/workflows/step9_pin_all_actions.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pin-actions:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Pin remaining known mutable action refs
        run: python scripts/pin_github_actions_refs.py
      - name: Persist immutable workflow refs if changed
        run: |
          git config user.name 'victor-security-hardening'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/workflows
          git diff --cached --quiet && exit 0
          git commit -m 'security(step9): pin remaining GitHub Actions to immutable SHAs'
          git pull --rebase --autostash
          git push origin HEAD:main
