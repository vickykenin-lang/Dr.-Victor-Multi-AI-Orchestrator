name: Enrich Cognee Recall Diagnostic

on:
  push:
    branches: [ main ]
    paths:
      - 'scripts/enrich_cognee_recall_diagnostic.py'
      - '.github/workflows/enrich-cognee-recall-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.x'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Apply enriched recall diagnostic
        run: python scripts/enrich_cognee_recall_diagnostic.py
      - name: Syntax check
        run: node --check victor-telegram-worker/worker.js
      - name: Run memory tests
        run: node --test victor-telegram-worker/cognee_memory_bridge.test.mjs
      - name: Persist patch if changed
        run: |
          if git diff --quiet; then
            echo 'No runtime change required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add victor-telegram-worker/worker.js
          git commit -m 'runtime: expose safe Cognee recall relevance diagnostics'
          git push
