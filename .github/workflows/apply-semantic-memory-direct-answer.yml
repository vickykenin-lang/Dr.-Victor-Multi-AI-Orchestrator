name: Apply Semantic Memory Direct Answer

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_semantic_memory_direct_answer.py'
      - 'victor-telegram-worker/remembered_fact_gate.mjs'
      - 'victor-telegram-worker/remembered_fact_gate.test.mjs'
      - '.github/workflows/apply-semantic-memory-direct-answer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.x'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Apply semantic direct-answer patch
        run: python scripts/apply_semantic_memory_direct_answer.py
      - name: Syntax check worker
        run: |
          node --check victor-telegram-worker/worker.js
          node --check victor-telegram-worker/remembered_fact_gate.mjs
      - name: Run memory tests
        run: |
          node --test victor-telegram-worker/cognee_memory_bridge.test.mjs
          node --test victor-telegram-worker/memory_brain.test.mjs
          node --test victor-telegram-worker/remembered_fact_gate.test.mjs
      - name: Verify deterministic memory answer guard
        run: |
          grep -q "selectDirectRememberedFact" victor-telegram-worker/worker.js
          grep -q "CANONICAL_CONTRADICTION" victor-telegram-worker/remembered_fact_gate.mjs
      - name: Persist patch if changed
        run: |
          if git diff --quiet; then
            echo "No runtime changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add victor-telegram-worker/worker.js victor-telegram-worker/remembered_fact_gate.mjs victor-telegram-worker/remembered_fact_gate.test.mjs
          git commit -m "runtime: answer semantic-only remembered facts deterministically"
          git push
