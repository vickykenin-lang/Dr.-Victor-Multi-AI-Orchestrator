name: Victor Package 8 Commercial Outcome

on:
  push:
    branches: [main]
    paths:
      - 'data/revenue_outcomes.json'
      - 'scripts/package8_commercial_gate.py'
      - '.github/workflows/victor_package8_commercial_outcome.yml'
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  commercial-truth:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Validate canonical revenue ledger
        run: python3 scripts/validate_revenue_outcomes.py
      - name: Build commercial closure status
        run: python3 scripts/package8_commercial_gate.py
      - name: Upload commercial truth evidence
        uses: actions/upload-artifact@v4
        with:
          name: victor-commercial-outcome-${{ github.run_id }}
          path: data/package8_commercial_status.json
          retention-days: 30
