name: Victor Production Acceptance

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/victor_production_acceptance.yml'
      - 'brain/**'
      - 'victor-telegram-worker/**'
      - 'wrangler.toml'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: victor-production-evidence-main
  cancel-in-progress: false

jobs:
  production-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_BOT_TOKEN_VICTOR: ${{ secrets.TELEGRAM_BOT_TOKEN_VICTOR }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Probe deployed Victor without impersonating Founder
        run: |
          python - <<'PY'
          import json, os, urllib.parse, urllib.request, urllib.error
          from datetime import datetime, timezone
          from pathlib import Path

          OUT = Path('data/production_acceptance_status.json')
          token = (os.getenv('TELEGRAM_BOT_TOKEN_VICTOR') or '').strip()
          report = {
              'schema_version': 3,
              'checked_at_utc': datetime.now(timezone.utc).isoformat(),
              'repository_sha_under_test': os.getenv('GITHUB_SHA'),
              'production_verification': {},
              'live_acceptance': {'synthetic_founder_events_sent': False, 'founder_acceptance_required': True},
              'critical_blockers': [],
              'ready_for_founder_test': False,
              'secrets_exposed': False,
          }

          def parse(raw):
              try: return json.loads(raw)
              except Exception: return {'raw_response_type':'non_json','body_prefix':raw[:120]}
          def get_json(url, timeout=45):
              req=urllib.request.Request(url,headers={'User-Agent':'Victor-Production-Acceptance/3.0'},method='GET')
              try:
                  with urllib.request.urlopen(req,timeout=timeout) as r: return r.status, parse(r.read().decode('utf-8',errors='replace'))
              except urllib.error.HTTPError as e: return e.code, parse(e.read().decode('utf-8',errors='replace'))

          if not token:
              report['critical_blockers'].append('GITHUB_SECRET_TELEGRAM_BOT_TOKEN_VICTOR_MISSING')
          else:
              try:
                  hook_code, hook = get_json(f'https://api.telegram.org/bot{token}/getWebhookInfo')
                  hook_result=hook.get('result') or {}; hook_url=str(hook_result.get('url') or '').strip()
                  report['production_verification']['telegram_webhook']={'api_http_status':hook_code,'configured':bool(hook_url),'pending_update_count':hook_result.get('pending_update_count'),'last_error_present':bool(hook_result.get('last_error_message'))}
                  if hook_code != 200 or not hook_url: report['critical_blockers'].append('TELEGRAM_WEBHOOK_URL_NOT_CONFIGURED')
                  else:
                      p=urllib.parse.urlparse(hook_url); origin=f'{p.scheme}://{p.netloc}'
                      for endpoint,key in [('/health','health'),('/core-health','core_health'),('/aura3-bridge-health','aura3_bridge'),('/tony-bridge-health','tony_bridge')]:
                          try:
                              code,payload=get_json(origin+endpoint); report['production_verification'][key]={'http_status':code,'payload':payload}
                              if code != 200: report['critical_blockers'].append(f'{key.upper()}_PROBE_FAILED')
                          except Exception as exc:
                              report['production_verification'][key]={'error':type(exc).__name__}; report['critical_blockers'].append(f'{key.upper()}_PROBE_FAILED')
                      health=(report['production_verification'].get('health') or {}).get('payload') or {}
                      for field in ['telegram_token_configured','webhook_secret_configured','founder_chat_configured','ai_inference_enabled']:
                          if health.get(field) is not True: report['critical_blockers'].append(f'HEALTH_{field.upper()}_NOT_TRUE')
                      if health.get('active_thread_memory_durable') is not True: report['critical_blockers'].append('DURABLE_CONVERSATION_STATE_NOT_ACTIVE')
                      report['production_verification']['deployment_identity']={'deployment_git_sha':health.get('deployment_git_sha'),'deployment_build_uuid':health.get('deployment_build_uuid'),'cloudflare_version_id':health.get('cloudflare_version_id'),'deployment_identity_gate':health.get('deployment_identity_gate')}
              except Exception as exc:
                  report['critical_blockers'].append('PRODUCTION_DISCOVERY_FAILED'); report['production_verification']['discovery_error']=type(exc).__name__

          report['critical_blockers']=sorted(set(report['critical_blockers']))
          report['ready_for_founder_test']=len(report['critical_blockers']) == 0
          OUT.write_text(json.dumps(report,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({'ready_for_founder_test':report['ready_for_founder_test'],'critical_blockers':report['critical_blockers'],'synthetic_founder_events_sent':False,'secrets_exposed':False}))
          PY

      - name: Upload production acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: victor-production-acceptance-${{ github.run_id }}
          path: data/production_acceptance_status.json
          if-no-files-found: error
          retention-days: 30

      - name: Enforce readiness gate
        if: always()
        run: |
          python - <<'PY'
          import json
          d=json.load(open('data/production_acceptance_status.json',encoding='utf-8'))
          print('READY_FOR_FOUNDER_TEST' if d.get('ready_for_founder_test') else 'NOT_READY')
          if not d.get('ready_for_founder_test'):
              print('Critical blockers:', ', '.join(d.get('critical_blockers') or []))
              raise SystemExit(1)
          PY
