name: Victor V2 Step 7 Self-Modification Red-Team Tests

on:
  pull_request:
    paths:
      - 'brain/adaptive_security.mjs'
      - 'brain/security_kernel.mjs'
      - 'brain/red_team_guards.mjs'
      - 'brain/step7_self_modification_security_redteam.test.mjs'
      - '.github/workflows/victor_v2_step7_self_modification_redteam_tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  self-modification-redteam:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
      - name: Syntax check
        run: |
          node --check brain/adaptive_security.mjs
          node --check brain/security_kernel.mjs
          node --check brain/red_team_guards.mjs
          node --check brain/step7_self_modification_security_redteam.test.mjs
      - name: Run Step 7 self-modification red-team pack
        run: node --test brain/step7_self_modification_security_redteam.test.mjs
      - name: Run existing Block 5 red-team regression
        run: node --test brain/block5_redteam_security.test.mjs
