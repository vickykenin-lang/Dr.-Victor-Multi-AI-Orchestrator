name: Package 2 Apply Runtime Wiring

on:
  push:
    branches:
      - endgame/package-2-runtime-completion
    paths:
      - '.github/workflows/package2_apply_runtime_wiring.yml'
      - 'scripts/apply_package2_runtime_wiring.py'
      - 'victor-telegram-worker/endgame_runtime_acceptance.mjs'
      - 'victor-telegram-worker/endgame_runtime_acceptance.test.mjs'

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout package branch
        uses: actions/checkout@v4
        with:
          ref: endgame/package-2-runtime-completion
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply deterministic Package 2 wiring
        run: python scripts/apply_package2_runtime_wiring.py
      - name: Syntax and regression tests
        run: |
          node --check victor-telegram-worker/worker.js
          node --check victor-telegram-worker/endgame_runtime_acceptance.mjs
          node --test victor-telegram-worker/endgame_runtime_acceptance.test.mjs brain/procedure_registry.test.mjs brain/degraded_mode.test.mjs brain/truthful_telemetry.test.mjs brain/experience_ledger.test.mjs brain/endgame_runtime_gate.test.mjs
      - name: Commit generated wiring
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add victor-telegram-worker/worker.js .github/workflows/victor_v2_block5_production_deploy.yml
          git commit -m 'endgame: wire Package 2 runtime acceptance into production path'
          git push origin HEAD:endgame/package-2-runtime-completion
