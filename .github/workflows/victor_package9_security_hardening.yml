name: Victor Package 9 Security Hardening

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-hardening-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify critical autonomy and production workflows use immutable action refs
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            .github/workflows/victor_package4_green_autonomy.yml \
            .github/workflows/victor_package5_amber_autonomy.yml \
            .github/workflows/victor_package6_reliability_supervision.yml \
            .github/workflows/victor_package7_control_room.yml \
            .github/workflows/victor_package8_commercial_outcome.yml \
            .github/workflows/victor_package9_security_hardening.yml \
            .github/workflows/victor_package10_final_endgame_gate.yml \
            .github/workflows/victor_v2_block5_production_deploy.yml; do
            if grep -En 'uses: (actions/checkout|actions/setup-node|actions/setup-python|actions/upload-artifact)@v[0-9]+' "$f"; then
              echo "MUTABLE_CRITICAL_ACTION_REF:$f" >&2
              exit 1
            fi
          done
          echo 'CRITICAL_ACTION_REFS_IMMUTABLE'
      - name: Require zero mutable action refs repository-wide
        shell: bash
        run: |
          set -euo pipefail
          set +e
          grep -RInE 'uses: [A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+@v[0-9]+' .github/workflows > /tmp/mutable-action-refs.txt
          grep_status=$?
          set -e
          count=$(wc -l < /tmp/mutable-action-refs.txt | tr -d ' ')
          echo "remaining_mutable_action_refs=$count"
          cat /tmp/mutable-action-refs.txt || true
          if [ "$count" -ne 0 ]; then
            echo 'MUTABLE_ACTION_REFS_REMAIN' >&2
            exit 1
          fi
          [ "$grep_status" -eq 1 ] || { echo 'ACTION_REF_SCAN_ERROR' >&2; exit 1; }
          echo 'REPOSITORY_ACTION_REFS_IMMUTABLE'
      - name: Verify high and critical dependency findings are remediated
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm audit --json > /tmp/npm-audit.json || true
          node - <<'NODE'
          const fs=require('fs');
          const j=JSON.parse(fs.readFileSync('/tmp/npm-audit.json','utf8'));
          const v=(j.metadata&&j.metadata.vulnerabilities)||{};
          console.log(JSON.stringify({status:'DEPENDENCY_AUDIT_CAPTURED',metadata:j.metadata||{},automatic_force_fix_performed:false},null,2));
          if ((v.high||0)>0 || (v.critical||0)>0) {
            throw new Error(`HIGH_OR_CRITICAL_DEPENDENCY_FINDINGS_REMAIN:${v.high||0}:${v.critical||0}`);
          }
          console.log('DEPENDENCY_HIGH_CRITICAL_ZERO');
          NODE
      - name: Upload security evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: victor-package9-security-${{ github.run_id }}
          path: |
            /tmp/mutable-action-refs.txt
            /tmp/npm-audit.json
          retention-days: 30
