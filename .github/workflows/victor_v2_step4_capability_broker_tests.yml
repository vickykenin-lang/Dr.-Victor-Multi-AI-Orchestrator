name: Victor V2 Step 4 Capability Broker Tests

on:
  pull_request:
    paths:
      - 'brain/capability_broker.mjs'
      - 'brain/security_kernel.mjs'
      - 'brain/sandbox_manager.mjs'
      - 'brain/step4_capability_broker_lifecycle.test.mjs'
      - '.github/workflows/victor_v2_step4_capability_broker_tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capability-broker-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
      - name: Syntax check
        run: |
          node --check brain/capability_broker.mjs
          node --check brain/security_kernel.mjs
          node --check brain/sandbox_manager.mjs
          node --check brain/step4_capability_broker_lifecycle.test.mjs
      - name: Run Step 4 lifecycle acceptance pack
        run: node --test brain/step4_capability_broker_lifecycle.test.mjs
