name: Victor V2 Step 6 Watchdog Circuit-Breaker Tests

on:
  pull_request:
    paths:
      - 'brain/safety_watchdog.mjs'
      - 'brain/shadow_autonomy_runtime.mjs'
      - 'brain/step6_watchdog_circuit_breaker.test.mjs'
      - '.github/workflows/victor_v2_step6_watchdog_tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  watchdog-circuit-breaker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
      - name: Syntax check
        run: |
          node --check brain/safety_watchdog.mjs
          node --check brain/shadow_autonomy_runtime.mjs
          node --check brain/step6_watchdog_circuit_breaker.test.mjs
      - name: Run Step 6 watchdog acceptance pack
        run: node --test brain/step6_watchdog_circuit_breaker.test.mjs
