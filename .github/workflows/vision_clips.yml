name: Vision EP001 Auto Clips

on:
  workflow_dispatch:
    inputs:
      only_ids:
        description: "B1 first"
        required: false
        default: "B1"
      i2v_only:
        description: "1 = real I2V only"
        required: false
        default: "1"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Show I2V keys
        env:
          SORA2_API: ${{ secrets.SORA2_API }}
          SORA2_API_KEY: ${{ secrets.SORA2_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_VIO_API_KEY: ${{ secrets.GEMINI_VIO_API_KEY }}
        run: |
          if [ -n "$SORA2_API" ]; then echo SORA2_API=SET; else echo SORA2_API=EMPTY; fi
          if [ -n "$SORA2_API_KEY" ]; then echo SORA2_API_KEY=SET; else echo SORA2_API_KEY=EMPTY; fi
          if [ -n "$OPENAI_API_KEY" ]; then echo OPENAI_API_KEY=SET; else echo OPENAI_API_KEY=EMPTY; fi
          if [ -n "$GEMINI_VIO_API_KEY" ]; then echo GEMINI_VIO_API_KEY=SET; else echo GEMINI_VIO_API_KEY=EMPTY; fi

      - name: Generate clips I2V
        env:
          SORA2_API: ${{ secrets.SORA2_API }}
          SORA2_API_KEY: ${{ secrets.SORA2_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_VIO_API_KEY: ${{ secrets.GEMINI_VIO_API_KEY }}
          GEMINI_VEO_API_KEY: ${{ secrets.GEMINI_VEO_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ONLY_IDS: ${{ inputs.only_ids }}
          I2V_ONLY: ${{ inputs.i2v_only }}
        run: python3 vision/scripts/auto_generate_clips.py

      - name: Assemble animatic master
        if: always()
        run: python3 vision/scripts/assemble_animatic.py || true

      - name: Upload clip artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ep001-clips
          path: |
            vision/episodes/EP001_Last_Delivery/clips/
            vision/episodes/EP001_Last_Delivery/masters/
          if-no-files-found: warn

      - name: Commit clips + master
        if: always()
        run: |
          git config user.name vision-bot
          git config user.email vision-bot@users.noreply.github.com
          git add vision/episodes/EP001_Last_Delivery/clips/ vision/episodes/EP001_Last_Delivery/masters/ || true
          if git diff --staged --quiet; then echo nothing; else
            git commit -m "vision: EP001 I2V ${{ inputs.only_ids }}"
            git pull --rebase origin main || git pull --rebase --autostash origin main || true
            git push
          fi
