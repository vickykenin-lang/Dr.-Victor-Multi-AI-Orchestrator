name: Step 9 Direct Writer Lockdown

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/step9_lockdown_direct_writers.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-lockdown:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Convert legacy/direct-main writers to read-only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          targets = [
            'apply-cognee-recall-diagnostic.yml',
            'apply-cognee-tenant-contract.yml',
            'apply-memory-source-precedence-fix.yml',
            'apply-semantic-memory-direct-answer.yml',
            'apply-victor-brain-runtime.yml',
            'enrich-cognee-recall-diagnostic.yml',
            'fix_step8_certification_anchor.yml',
            'fix_v2_watchdog_live_context.yml',
            'patch-memory-recall-fact-gateway.yml',
            'patch_package3_aura_dispatch_diagnostic.yml',
            'phase1_health_diagnostic.yml',
            'phase1_release_acceptance.yml',
            'soul_bootstrap.yml',
            'step9_pin_all_actions.yml',
            'victor_production_acceptance.yml',
            'victor_production_probe_v2.yml',
            'victor_tony_transport.yml',
            'victor_v2_block5_live_verify.yml',
            'victor_v2_bundle_build.yml',
            'victor_v2_live_sandbox_verification.yml',
            'vision_clips.yml',
            'vision_stills.yml',
          ]
          root=Path('.github/workflows')
          changed=[]
          for name in targets:
              p=root/name
              text=p.read_text(encoding='utf-8')
              old=text
              text=text.replace('permissions:\n  contents: write', 'permissions:\n  contents: read', 1)
              if text == old:
                  raise SystemExit(f'EXPECTED_CONTENTS_WRITE_NOT_FOUND:{name}')
              lines=text.splitlines()
              out=[]
              i=0
              while i < len(lines):
                  line=lines[i]
                  out.append(line)
                  if 'uses: actions/checkout@' in line:
                      indent=line[:len(line)-len(line.lstrip())]
                      # Inspect this checkout step until next list step at the same indentation.
                      j=i+1
                      has_with=False
                      has_persist=False
                      while j < len(lines):
                          candidate=lines[j]
                          stripped=candidate.lstrip()
                          cand_indent=candidate[:len(candidate)-len(stripped)]
                          if stripped.startswith('- ') and len(cand_indent) <= len(indent):
                              break
                          if stripped == 'with:': has_with=True
                          if stripped.startswith('persist-credentials:'): has_persist=True
                          j += 1
                      if not has_persist:
                          if has_with:
                              pass
                          else:
                              out.append(indent+'  with:')
                              out.append(indent+'    persist-credentials: false')
                  i += 1
              # Second pass: if checkout has with but no persist, inject under with.
              lines=out
              out=[]
              in_checkout=False
              checkout_indent=''
              injected=False
              for idx,line in enumerate(lines):
                  stripped=line.lstrip(); indent=line[:len(line)-len(stripped)]
                  if 'uses: actions/checkout@' in line:
                      in_checkout=True; checkout_indent=indent; injected=False
                  if in_checkout and stripped == 'with:':
                      out.append(line)
                      # Look ahead for existing persist; insert if absent in immediate with block.
                      k=idx+1; found=False
                      while k < len(lines):
                          s2=lines[k].lstrip(); i2=lines[k][:len(lines[k])-len(s2)]
                          if len(i2) <= len(indent) and s2.startswith('- '): break
                          if s2.startswith('persist-credentials:'): found=True; break
                          k += 1
                      if not found:
                          out.append(indent+'  persist-credentials: false')
                          injected=True
                      continue
                  out.append(line)
                  if in_checkout and idx+1 < len(lines):
                      ns=lines[idx+1].lstrip(); ni=lines[idx+1][:len(lines[idx+1])-len(ns)]
                      if ns.startswith('- ') and len(ni) <= len(checkout_indent):
                          in_checkout=False
              new='\n'.join(out)+'\n'
              p.write_text(new,encoding='utf-8')
              changed.append(name)
          # Make the readiness audit judge authority, not dead text: a push is blocking only when the workflow still has contents:write.
          audit=root/'step9_branch_protection_readiness.yml'
          text=audit.read_text(encoding='utf-8')
          old="""              for item in pushes:\n                  cmd=item['command']\n                  safe_non_main=('vision-runtime-state' in cmd)\n                  if not safe_non_main:\n                      findings.append({'file':str(path),'line':item['line'],'command':cmd,'reason':'DIRECT_OR_AMBIGUOUS_GIT_PUSH_FROM_WORKFLOW'})\n"""
          new="""              for item in pushes:\n                  cmd=item['command']\n                  safe_non_main=('vision-runtime-state' in cmd or 'CANARY_BRANCH' in cmd)\n                  if has_write and not safe_non_main:\n                      findings.append({'file':str(path),'line':item['line'],'command':cmd,'reason':'WRITE_AUTHORITY_WITH_DIRECT_OR_AMBIGUOUS_GIT_PUSH'})\n"""
          if old not in text:
              raise SystemExit('READINESS_AUDIT_ANCHOR_NOT_FOUND')
          audit.write_text(text.replace(old,new,1),encoding='utf-8')
          # Remove this one-time privileged runner from the generated security branch.
          Path('.github/workflows/step9_lockdown_direct_writers.yml').unlink()
          print('LOCKDOWN_TARGETS_CONVERTED', len(changed))
          PY
      - name: Verify generated security state
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          blockers=[]
          for p in sorted(Path('.github/workflows').glob('*.y*ml')):
              t=p.read_text(encoding='utf-8')
              write=bool(re.search(r'(?m)^\s*contents:\s*write\s*$',t))
              if not write: continue
              for n,line in enumerate(t.splitlines(),1):
                  s=line.strip()
                  if re.search(r'\bgit\s+push\b',s) and 'vision-runtime-state' not in s and 'CANARY_BRANCH' not in s:
                      blockers.append((str(p),n,s))
          if blockers:
              raise SystemExit('GENERATED_LOCKDOWN_STILL_HAS_BLOCKERS:'+repr(blockers))
          print('GENERATED_STEP9_DIRECT_WRITER_LOCKDOWN_PASS')
          PY
      - name: Publish generated lockdown branch only
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="security/step9-lockdown-generated-${GITHUB_RUN_ID}"
          git config user.name "victor-step9-security"
          git config user.email "actions@users.noreply.github.com"
          git add -A .github/workflows
          git diff --cached --quiet && { echo 'NO_LOCKDOWN_DIFF'; exit 1; }
          git commit -m "security(step9): remove direct main workflow write authority"
          git push origin HEAD:"$BRANCH"
          echo "GENERATED_BRANCH=$BRANCH"
