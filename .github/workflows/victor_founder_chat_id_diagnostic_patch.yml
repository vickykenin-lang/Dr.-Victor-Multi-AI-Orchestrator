name: Victor Founder Chat ID Diagnostic Patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/victor_founder_chat_id_diagnostic_patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add safe MY CHAT ID diagnostic
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('victor-telegram-worker/worker.js')
          text = path.read_text(encoding='utf-8')
          old = """    const chatId = String(message?.chat?.id ?? '');
    if (!chatId) return json({ ok: true, ignored: true });
    const senderId = String(message?.from?.id ?? '');
    if (!isAuthorizedFounderMessage(env, chatId, senderId)) {
      return json({ ok: true, ignored: true, reason: 'chat_not_authorized' });
    }

    const text = message.text.trim();
    if (!text) return json({ ok: true, ignored: true });
"""
          new = """    const chatId = String(message?.chat?.id ?? '');
    if (!chatId) return json({ ok: true, ignored: true });

    const text = message.text.trim();
    if (!text) return json({ ok: true, ignored: true });

    // Temporary self-diagnostic: returns only the sender's own Telegram chat ID.
    // It grants no Founder authority and runs before authorization solely so an
    // unregistered Founder chat can bootstrap the protected VICTOR_FOUNDER_CHAT_ID.
    if (/^MY CHAT ID$/i.test(text)) {
      await sendTelegramMessage(env, chatId, `Your Telegram Chat ID: ${chatId}`, message.message_id);
      return json({ ok: true, mode: 'CHAT_ID_DIAGNOSTIC', delivered: true, secrets_exposed: false });
    }

    const senderId = String(message?.from?.id ?? '');
    if (!isAuthorizedFounderMessage(env, chatId, senderId)) {
      return json({ ok: true, ignored: true, reason: 'chat_not_authorized' });
    }
"""
          if old not in text:
              raise SystemExit('Expected authorization block not found; refusing unsafe patch')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          node --check victor-telegram-worker/worker.js

      - name: Commit deterministic diagnostic patch
        run: |
          git config user.name "victor-security-ops"
          git config user.email "actions@users.noreply.github.com"
          git add victor-telegram-worker/worker.js
          git diff --cached --quiet && exit 0
          git commit -m "ops: enable temporary Founder chat id diagnostic"
          git push origin HEAD:main
