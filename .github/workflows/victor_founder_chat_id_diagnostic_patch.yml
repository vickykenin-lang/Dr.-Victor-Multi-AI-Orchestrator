name: Victor Founder Chat ID Diagnostic Patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/victor_founder_chat_id_diagnostic_patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add safe MY CHAT ID diagnostic
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('victor-telegram-worker/worker.js')
          text = path.read_text(encoding='utf-8')
          old = (
              "    const chatId = String(message?.chat?.id ?? '');\n"
              "    if (!chatId) return json({ ok: true, ignored: true });\n"
              "    const senderId = String(message?.from?.id ?? '');\n"
              "    if (!isAuthorizedFounderMessage(env, chatId, senderId)) {\n"
              "      return json({ ok: true, ignored: true, reason: 'chat_not_authorized' });\n"
              "    }\n\n"
              "    const text = message.text.trim();\n"
              "    if (!text) return json({ ok: true, ignored: true });\n"
          )
          new = (
              "    const chatId = String(message?.chat?.id ?? '');\n"
              "    if (!chatId) return json({ ok: true, ignored: true });\n\n"
              "    const text = message.text.trim();\n"
              "    if (!text) return json({ ok: true, ignored: true });\n\n"
              "    // Temporary self-diagnostic: returns only the sender's own Telegram chat ID.\n"
              "    // It grants no Founder authority and runs before authorization solely so an\n"
              "    // unregistered Founder chat can bootstrap the protected VICTOR_FOUNDER_CHAT_ID.\n"
              "    if (/^MY CHAT ID$/i.test(text)) {\n"
              "      await sendTelegramMessage(env, chatId, `Your Telegram Chat ID: ${chatId}`, message.message_id);\n"
              "      return json({ ok: true, mode: 'CHAT_ID_DIAGNOSTIC', delivered: true, secrets_exposed: false });\n"
              "    }\n\n"
              "    const senderId = String(message?.from?.id ?? '');\n"
              "    if (!isAuthorizedFounderMessage(env, chatId, senderId)) {\n"
              "      return json({ ok: true, ignored: true, reason: 'chat_not_authorized' });\n"
              "    }\n"
          )
          if old not in text:
              raise SystemExit('Expected authorization block not found; refusing unsafe patch')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          node --check victor-telegram-worker/worker.js

      - name: Commit deterministic diagnostic patch
        run: |
          git config user.name "victor-security-ops"
          git config user.email "actions@users.noreply.github.com"
          git add victor-telegram-worker/worker.js
          git diff --cached --quiet && exit 0
          git commit -m "ops: enable temporary Founder chat id diagnostic"
          git push origin HEAD:main
