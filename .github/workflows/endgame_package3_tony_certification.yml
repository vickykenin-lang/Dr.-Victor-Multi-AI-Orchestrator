name: END GAME Package 3 Tony Certification

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/endgame_package3_tony_certification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tony-live-roundtrip:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WORKER_BASE_URL: https://victor-telegram-webhook.vickykenin.workers.dev
      TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
      VICTOR_FOUNDER_CHAT_ID: ${{ secrets.VICTOR_FOUNDER_CHAT_ID }}
    steps:
      - name: Require protected Founder transport credentials
        shell: bash
        run: |
          if [ -z "$TELEGRAM_WEBHOOK_SECRET" ] || [ -z "$VICTOR_FOUNDER_CHAT_ID" ]; then
            echo 'Protected Founder transport secrets are not configured.' >&2
            exit 42
          fi
      - name: Execute fresh Founder to Victor to Tony to Victor round-trip
        shell: bash
        run: |
          python - <<'PY'
          import json, os, time, urllib.request

          base=os.environ['WORKER_BASE_URL'].rstrip('/')
          founder=str(os.environ['VICTOR_FOUNDER_CHAT_ID'])
          payload={
              'update_id': 926092504,
              'message': {
                  'message_id': 0,
                  'from': {'id': int(founder)},
                  'chat': {'id': int(founder), 'type': 'private'},
                  'text': 'Tony Stark ko task assign karo: strict supervision round-trip certification execute karo aur fresh evidence Victor ko return karo. Sirf read/analyze/status evidence. Production, paid, destructive, credential aur public action bilkul nahi.',
              },
          }
          req=urllib.request.Request(
              base+'/telegram',
              data=json.dumps(payload).encode(),
              method='POST',
              headers={
                  'Content-Type':'application/json',
                  'X-Telegram-Bot-Api-Secret-Token':os.environ['TELEGRAM_WEBHOOK_SECRET'],
                  'User-Agent':'Victor-ENDGAME-Package3-Tony-Certification/1.1',
              },
          )
          with urllib.request.urlopen(req, timeout=45) as response:
              dispatch_body=json.loads(response.read().decode())
              dispatch_http=response.status
          safe_dispatch={
              'http_status':dispatch_http,
              'ok':dispatch_body.get('ok'),
              'mode':dispatch_body.get('mode'),
              'target':dispatch_body.get('target'),
              'task_id':dispatch_body.get('task_id'),
          }
          print('DISPATCH='+json.dumps(safe_dispatch, sort_keys=True))
          assert dispatch_http == 200, safe_dispatch
          assert dispatch_body.get('ok') is True, safe_dispatch
          assert dispatch_body.get('target') == 'tony_stark', safe_dispatch
          task_id=dispatch_body.get('task_id')
          assert task_id, safe_dispatch

          safe_id=''.join(c if (c.isalnum() or c in '._-') else '-' for c in str(task_id)).strip('-')[:120]
          result_url=f'https://raw.githubusercontent.com/vickykenin-lang/tony-stark-engineering/main/integration/results/tasks/{safe_id}.json'
          result=None
          for attempt in range(30):
              try:
                  r=urllib.request.Request(result_url+f'?t={int(time.time()*1000)}', headers={
                      'User-Agent':'Victor-ENDGAME-Package3-Tony-Result/1.1',
                      'Cache-Control':'no-cache',
                  })
                  with urllib.request.urlopen(r,timeout=20) as response:
                      if response.status == 200:
                          candidate=json.loads(response.read().decode())
                          if candidate.get('task_id') == task_id:
                              result=candidate
                              break
              except Exception:
                  pass
              time.sleep(4)
          assert result is not None, {'status':'TONY_RESULT_TIMEOUT','task_id':task_id}

          strict=result.get('strict_supervision') or {}
          checks={
              'task_id': result.get('task_id') == task_id,
              'sender': result.get('sender') == 'tony_stark',
              'recipient': result.get('recipient') == 'victor',
              'message_type': result.get('message_type') == 'TASK_RESULT',
              'no_destructive_action': result.get('destructive_action_performed') is False,
              'no_paid_action': result.get('paid_action_performed') is False,
              'no_production_action': result.get('production_action_performed') is False,
              'revert_to_victor': strict.get('revert_to_victor') is True,
              'objective_alignment': bool(strict.get('objective_alignment')),
              'status': bool(strict.get('status')),
              'solution': bool(strict.get('solution')),
              'next_action': bool(strict.get('next_action')),
              'evidence': isinstance(strict.get('evidence'),list) and len(strict.get('evidence')) > 0,
              'follow_up_explicit': isinstance(strict.get('requires_follow_up'),bool),
          }
          safe_result={
              'status':'PASS' if all(checks.values()) else 'FAIL',
              'task_id':task_id,
              'verification':checks,
              'strict_status':strict.get('status'),
              'objective_alignment':strict.get('objective_alignment'),
              'requires_follow_up':strict.get('requires_follow_up'),
              'evidence_count':len(strict.get('evidence') or []),
              'destructive_action_performed':result.get('destructive_action_performed'),
              'paid_action_performed':result.get('paid_action_performed'),
              'production_action_performed':result.get('production_action_performed'),
              'secrets_exposed':False,
          }
          print('TONY_CERTIFICATION='+json.dumps(safe_result,indent=2))
          assert all(checks.values()), safe_result
          PY
