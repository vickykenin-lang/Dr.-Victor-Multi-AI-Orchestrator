name: END GAME P0 Runtime Regression

on:
  push:
    branches:
      - 'endgame/**'
    paths:
      - 'brain/action_contract.mjs'
      - 'brain/action_contract.test.mjs'
      - 'brain/progress_contract.mjs'
      - 'brain/progress_contract.test.mjs'
      - 'brain/executive_reasoning.mjs'
      - 'brain/executive_reasoning.test.mjs'
      - 'brain/founder_guidance.mjs'
      - 'brain/founder_guidance.test.mjs'
      - 'brain/experience_ledger.mjs'
      - 'brain/experience_ledger.test.mjs'
      - 'brain/cognee_advisory.mjs'
      - 'brain/cognee_advisory.test.mjs'
      - 'brain/procedure_registry.mjs'
      - 'brain/procedure_registry.test.mjs'
      - 'brain/degraded_mode.mjs'
      - 'brain/degraded_mode.test.mjs'
      - 'brain/truthful_telemetry.mjs'
      - 'brain/truthful_telemetry.test.mjs'
      - 'brain/deployment_identity_gate.test.mjs'
      - 'brain/endgame_runtime_gate.mjs'
      - 'brain/endgame_runtime_gate.test.mjs'
      - 'victor-telegram-worker/autonomy_runtime.mjs'
      - 'victor-telegram-worker/autonomy_runtime.test.mjs'
      - 'victor-telegram-worker/department_bridge.mjs'
      - 'victor-telegram-worker/department_bridge.test.mjs'
      - 'victor-telegram-worker/worker.js'
      - '.github/workflows/endgame_p0_action_contract_tests.yml'

permissions:
  contents: read

jobs:
  endgame-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Run END GAME P0 runtime regression tests
        run: >-
          node --test
          brain/action_contract.test.mjs
          brain/progress_contract.test.mjs
          brain/executive_reasoning.test.mjs
          brain/founder_guidance.test.mjs
          brain/experience_ledger.test.mjs
          brain/cognee_advisory.test.mjs
          brain/procedure_registry.test.mjs
          brain/degraded_mode.test.mjs
          brain/truthful_telemetry.test.mjs
          brain/deployment_identity_gate.test.mjs
          brain/endgame_runtime_gate.test.mjs
          victor-telegram-worker/department_bridge.test.mjs
          victor-telegram-worker/autonomy_runtime.test.mjs
      - name: Syntax check END GAME runtime modules
        run: |
          node --check brain/action_contract.mjs
          node --check brain/progress_contract.mjs
          node --check brain/executive_reasoning.mjs
          node --check brain/founder_guidance.mjs
          node --check brain/experience_ledger.mjs
          node --check brain/cognee_advisory.mjs
          node --check brain/procedure_registry.mjs
          node --check brain/degraded_mode.mjs
          node --check brain/truthful_telemetry.mjs
          node --check brain/endgame_runtime_gate.mjs
          node --check victor-telegram-worker/department_bridge.mjs
          node --check victor-telegram-worker/autonomy_runtime.mjs
          node --check victor-telegram-worker/worker.js
