name: One-Off Pin All GitHub Actions

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oneoff_pin_all_github_actions.yml'

permissions:
  contents: write

jobs:
  pin-actions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Replace mutable first-party action tags with immutable SHAs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          replacements={
            'actions/checkout@v4':'actions/checkout@11d5960a326750d5838078e36cf38b85af677262',
            'actions/setup-node@v4':'actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020',
            'actions/setup-python@v5':'actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065',
            'actions/upload-artifact@v4':'actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02',
          }
          changed=[]
          for p in Path('.github/workflows').glob('*.yml'):
            text=p.read_text(encoding='utf-8')
            new=text
            for a,b in replacements.items(): new=new.replace(a,b)
            if new!=text:
              p.write_text(new,encoding='utf-8')
              changed.append(str(p))
          print('changed_files=',len(changed))
          print('\n'.join(changed))
          PY
      - name: Commit pinned refs
        run: |
          if git diff --quiet; then
            echo 'NO_CHANGES'
            exit 0
          fi
          git config user.name 'victor-security-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows
          git commit -m 'security: pin all first-party GitHub Actions refs'
          git push origin HEAD:main
