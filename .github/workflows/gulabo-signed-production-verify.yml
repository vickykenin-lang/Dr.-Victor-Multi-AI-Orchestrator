name: Gulabo Signed Production Verify

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gulabo-signed-production-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PRIMARY_BASE_URL: https://victor-telegram-webhook.vickykenin.workers.dev
      EXPECTED_WORKER_SHA: b757ab22136d57fc8585fbd5e2638271618f60d9
      CLOUDFLARE_ACCOUNT_ID: d027de83cb964eb66fa56ffed27c0b27
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WORKER_NAME: victor-telegram-webhook
    steps:
      - name: Require protected Cloudflare credential
        shell: bash
        run: test -n "$CLOUDFLARE_API_TOKEN"

      - name: Verify production Gulabo bindings without exposing secrets
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request
          account=os.environ['CLOUDFLARE_ACCOUNT_ID']; worker=os.environ['WORKER_NAME']; token=os.environ['CLOUDFLARE_API_TOKEN']
          url=f'https://api.cloudflare.com/client/v4/accounts/{account}/workers/scripts/{worker}/settings'
          req=urllib.request.Request(url,headers={'Authorization':f'Bearer {token}','User-Agent':'Gulabo-Signed-Production-Verify/1.0'})
          with urllib.request.urlopen(req,timeout=20) as r: body=json.loads(r.read().decode())
          assert body.get('success') is True, body.get('errors')
          bindings=(body.get('result') or {}).get('bindings') or []
          by={b.get('name'):b for b in bindings if b.get('name')}
          required_secrets=['GULABO_HERMES_COMMAND_TOKEN','GULABO_HERMES_COMMAND_SECRET','GULABO_HERMES_CALLBACK_TOKEN','GULABO_HERMES_CALLBACK_SECRET']
          for name in required_secrets: assert by.get(name,{}).get('type')=='secret_text', name
          assert by.get('GULABO_API_BASE_URL',{}).get('type')=='plain_text'
          assert by['GULABO_API_BASE_URL'].get('text')=='https://api.designinfra.in/gulabo'
          assert by.get('AI',{}).get('type')=='ai'
          assert by.get('VICTOR_DEPLOY_GIT_SHA',{}).get('text')==os.environ['EXPECTED_WORKER_SHA']
          print(json.dumps({'status':'GULABO_PRODUCTION_BINDINGS_VERIFIED','dedicated_secret_bindings':4,'gulabo_api_base_url':'https://api.designinfra.in/gulabo','workers_ai_binding':True,'deploy_sha':os.environ['EXPECTED_WORKER_SHA']},indent=2))
          PY

      - name: Verify stable live Worker and Hermes command plane
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, time, urllib.request
          base=os.environ['PRIMARY_BASE_URL'].rstrip('/'); expected=os.environ['EXPECTED_WORKER_SHA']
          consecutive=0; last=None
          for _ in range(30):
              try:
                  def get(path):
                      req=urllib.request.Request(base+path,headers={'User-Agent':'Gulabo-Signed-Production-Verify/1.0','Cache-Control':'no-cache'})
                      with urllib.request.urlopen(req,timeout=15) as r: return r.status,json.loads(r.read().decode())
                  hs,h=get('/health'); vs,v=get('/v1/health')
                  last={'sha':h.get('deployment_git_sha'),'version':h.get('cloudflare_version_id'),'hermes_status':v.get('status')}
                  ok=(hs==200 and vs==200 and h.get('deployment_git_sha')==expected and bool(h.get('cloudflare_version_id')) and v.get('status')=='READY_FOR_COMMAND_ACCEPTANCE')
                  if ok:
                      consecutive+=1
                      if consecutive>=3:
                          print(json.dumps({'status':'GULABO_SIGNED_PRODUCTION_BRIDGE_VERIFIED','git_sha':expected,'cloudflare_version_id':h.get('cloudflare_version_id'),'stable_consecutive_reads':consecutive,'hermes_command_plane':'READY_FOR_COMMAND_ACCEPTANCE','dedicated_command_auth':True,'dedicated_callback_auth':True},indent=2)); raise SystemExit(0)
                  else: consecutive=0
              except Exception as exc:
                  consecutive=0; last={'error':str(exc)[:500]}
              time.sleep(3)
          print(json.dumps({'status':'GULABO_SIGNED_PRODUCTION_BRIDGE_NOT_STABLE','expected':expected,'last':last},indent=2)); raise SystemExit(1)
          PY
