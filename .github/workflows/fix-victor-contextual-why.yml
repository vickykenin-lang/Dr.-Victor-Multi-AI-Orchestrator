name: Fix Victor Contextual Why

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-victor-contextual-why.yml'

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch worker
        env:
          BLOCK_B64: ""
        run: |
          python - <<'PY'
          import base64, os
          from pathlib import Path
          p=Path('victor-telegram-worker/worker.js')
          s=p.read_text()
          anchor="      if (!memoryDirective && contextualFollowUp.mode === 'CONTEXTUAL_INVESTIGATION') {\n"
          block=base64.b64decode(os.environ['BLOCK_B64']).decode()
          if "contextualFollowUp.mode === 'CONTEXTUAL_EXPLANATION'" not in s:
              if anchor not in s:
                  raise SystemExit('anchor missing')
              s=s.replace(anchor, block+anchor,1)
          p.write_text(s)
          PY
      - name: Verify
        run: |
          node --check victor-telegram-worker/worker.js
          node --check brain/conversation_runtime.mjs
          node --input-type=module -e "import('./brain/conversation_runtime.mjs').then(m=>{const r=m.classifyConversationFollowUp('kyu?',{last_target:'rio',last_task_id:'t1',last_victor_reply:'verified'}); if(r.mode!=='CONTEXTUAL_EXPLANATION') process.exit(1);})"
      - name: Persist
        run: |
          git config user.name victor-governed-runtime
          git config user.email actions@users.noreply.github.com
          git add victor-telegram-worker/worker.js
          git diff --cached --quiet && exit 0
          git commit -m 'fix: keep why follow-ups conversational'
          git pull --rebase --autostash
          git push
