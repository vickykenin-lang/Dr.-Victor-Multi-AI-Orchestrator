name: Victor V2 Block 5 Production Deploy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/victor_v2_block5_production_deploy.yml'
      - 'wrangler.toml'
      - 'victor-telegram-worker/**'
      - 'brain/endgame_runtime_gate.mjs'
      - 'brain/procedure_registry.mjs'
      - 'brain/degraded_mode.mjs'
      - 'brain/truthful_telemetry.mjs'
      - 'brain/experience_ledger.mjs'
      - 'brain/founder_conversation.mjs'
      - 'brain/founder_conversation.test.mjs'
      - 'brain/conversation_runtime.mjs'
      - 'brain/conversation_runtime.test.mjs'
      - 'brain/founder_intent_gateway.mjs'
      - 'brain/founder_intent_gateway.test.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: d027de83cb964eb66fa56ffed27c0b27
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WORKER_NAME: victor-telegram-webhook
      PRIMARY_BASE_URL: https://victor-telegram-webhook.vickykenin.workers.dev
      EDGE_BASE_URL: https://victor-edge-proxy.vickykenin.workers.dev
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm

      - name: Require protected Cloudflare deploy credential
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'CLOUDFLARE_API_TOKEN is not configured' >&2; exit 42; }

      - name: Install pinned toolchain
        run: npm ci

      - name: Regression gate before production
        run: |
          node --check victor-telegram-worker/worker.js
          node --check victor-telegram-worker/endgame_runtime_acceptance.mjs
          node --check victor-telegram-worker/hermes_rio_image_provider.mjs
          node --test \
            brain/founder_conversation.test.mjs \
            brain/conversation_runtime.test.mjs \
            brain/founder_intent_gateway.test.mjs \
            brain/security_kernel.test.mjs \
            brain/action_contract.test.mjs \
            brain/block3_sandbox_security.test.mjs \
            brain/block4_promotion_shadow.test.mjs \
            brain/block5_redteam_security.test.mjs \
            victor-telegram-worker/endgame_runtime_acceptance.test.mjs \
            victor-telegram-worker/hermes_command_plane.test.mjs \
            victor-telegram-worker/hermes_rio_flyer_bridge.test.mjs \
            victor-telegram-worker/hermes_rio_image_provider.test.mjs

      - name: Build exact Worker module bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist/v2-live
          npx wrangler deploy --dry-run --outdir dist/v2-live
          BUNDLE=$(find dist/v2-live -maxdepth 1 -type f \( -name '*.js' -o -name '*.mjs' \) | sort | head -n 1)
          test -n "$BUNDLE"
          test -s "$BUNDLE"
          node --check "$BUNDLE"
          if [ "$BUNDLE" != 'dist/v2-live/worker.js' ]; then cp "$BUNDLE" dist/v2-live/worker.js; fi
          test -s dist/v2-live/worker.js

      - name: Upload Worker content preserving runtime config
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '{"main_module":"worker.js"}' > /tmp/metadata.json
          HTTP=$(curl --silent --show-error --output /tmp/cf-upload.json --write-out '%{http_code}' \
            --request PUT \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --form 'metadata=@/tmp/metadata.json;type=application/json' \
            --form 'worker.js=@dist/v2-live/worker.js;type=application/javascript+module' \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/content")
          python - "$HTTP" <<'PY'
          import json,sys
          code=int(sys.argv[1]); body=json.load(open('/tmp/cf-upload.json'))
          if code != 200 or body.get('success') is not True:
              print(json.dumps({'http_status':code,'errors':body.get('errors',[])},indent=2)); raise SystemExit(1)
          result=body.get('result') or {}
          print(json.dumps({'status':'WORKER_CONTENT_UPLOADED','modified_on':result.get('modified_on'),'etag':result.get('etag')},indent=2))
          PY

      - name: Stamp exact Git identity and central Workers AI binding
        shell: bash
        run: |
          set -euo pipefail
          HTTP=$(curl --silent --show-error --output /tmp/cf-settings.json --write-out '%{http_code}' \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/settings")
          python - "$HTTP" "$GITHUB_SHA" <<'PY'
          import json,sys
          code=int(sys.argv[1]); sha=sys.argv[2]; body=json.load(open('/tmp/cf-settings.json'))
          if code != 200 or body.get('success') is not True: raise SystemExit(f'CLOUDFLARE_SETTINGS_READ_FAILED:{code}')
          bindings=(body.get('result') or {}).get('bindings') or []
          inherited=[]; seen=set()
          for b in bindings:
              name=b.get('name')
              if not name or name in {'VICTOR_DEPLOY_GIT_SHA','AI'} or name in seen: continue
              seen.add(name); inherited.append({'name':name,'type':'inherit','version_id':'latest'})
          inherited.append({'name':'AI','type':'ai'})
          inherited.append({'name':'VICTOR_DEPLOY_GIT_SHA','type':'plain_text','text':sha})
          json.dump({'bindings':inherited},open('/tmp/settings-patch.json','w'),separators=(',',':'))
          print(json.dumps({'status':'CENTRAL_AI_BINDING_PATCH_PREPARED','protected_bindings_inherited':len(inherited)-2,'workers_ai_binding':'AI','target_git_sha':sha}))
          PY
          HTTP=$(curl --silent --show-error --output /tmp/cf-settings-patch.json --write-out '%{http_code}' \
            --request PATCH \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --form 'settings=@/tmp/settings-patch.json;type=application/json' \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/settings")
          python - "$HTTP" <<'PY'
          import json,sys
          code=int(sys.argv[1]); body=json.load(open('/tmp/cf-settings-patch.json'))
          if code != 200 or body.get('success') is not True:
              print(json.dumps({'http_status':code,'errors':body.get('errors',[])},indent=2)); raise SystemExit('CENTRAL_AI_BINDING_PATCH_FAILED')
          print(json.dumps({'status':'DEPLOYMENT_IDENTITY_AND_AI_BINDING_STAMPED','http_status':code}))
          PY

      - name: Verify central Workers AI binding exists without inference
        shell: bash
        run: |
          set -euo pipefail
          HTTP=$(curl --silent --show-error --output /tmp/cf-settings-verify.json --write-out '%{http_code}' \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/settings")
          python - "$HTTP" <<'PY'
          import json,sys
          code=int(sys.argv[1]); body=json.load(open('/tmp/cf-settings-verify.json'))
          if code != 200 or body.get('success') is not True: raise SystemExit(f'CLOUDFLARE_SETTINGS_VERIFY_FAILED:{code}')
          bindings=(body.get('result') or {}).get('bindings') or []
          ai=[b for b in bindings if b.get('name')=='AI' and b.get('type')=='ai']
          if len(ai)!=1: raise SystemExit('WORKERS_AI_BINDING_NOT_VERIFIED')
          print(json.dumps({'status':'WORKERS_AI_BINDING_VERIFIED','binding':'AI','provider_inference_performed':False}))
          PY

      - name: Wait for exact primary deployment identity
        shell: bash
        run: |
          python - <<'PY'
          import json,os,time,urllib.request
          url=os.environ['PRIMARY_BASE_URL'].rstrip('/')+'/health'; expected=os.environ['GITHUB_SHA']; last=None
          for _ in range(30):
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Victor-Deploy-Identity-Verify/2.0','Cache-Control':'no-cache'})
                  with urllib.request.urlopen(req,timeout=15) as r:
                      body=json.loads(r.read().decode()); last={'http_status':r.status,'body':body}
                      if r.status==200 and body.get('deployment_git_sha')==expected and body.get('cloudflare_version_id'):
                          print(json.dumps({'status':'LIVE_DEPLOYMENT_IDENTITY_VERIFIED','git_sha':expected,'cloudflare_version_id':body.get('cloudflare_version_id')},indent=2)); raise SystemExit(0)
              except Exception as e: last={'error':str(e)[:300]}
              time.sleep(3)
          print(json.dumps({'status':'DEPLOYMENT_IDENTITY_NOT_PROPAGATED','expected':expected,'last':last},indent=2)); raise SystemExit(1)
          PY

      - name: Verify primary runtime and governed edge ingress
        shell: bash
        run: |
          python - <<'PY'
          import json,os,urllib.request
          primary=os.environ['PRIMARY_BASE_URL'].rstrip('/'); edge=os.environ['EDGE_BASE_URL'].rstrip('/')
          targets={
            'health':primary+'/health',
            'v2':primary+'/v2-health',
            'endgame':primary+'/endgame-runtime-health',
            'core':primary+'/core-health',
            'aura3':primary+'/aura3-bridge-health',
            'tony':primary+'/tony-bridge-health',
            'hermes':primary+'/v1/health',
            'proxy':edge+'/proxy-health',
            'webhook':edge+'/telegram-webhook-health',
          }
          out={}
          for name,url in targets.items():
              req=urllib.request.Request(url,headers={'User-Agent':'Victor-Proxy-Aware-Live-Verify/2.0','Cache-Control':'no-cache'})
              with urllib.request.urlopen(req,timeout=20) as r:
                  out[name]={'http_status':r.status,'body':json.loads(r.read().decode())}
          assert all(v['http_status']==200 for v in out.values()), out
          h=out['health']['body']; v2=out['v2']['body']; eg=out['endgame']['body']; hermes=out['hermes']['body']; proxy=out['proxy']['body']; wh=out['webhook']['body']
          assert h.get('deployment_git_sha')==os.environ['GITHUB_SHA'], h
          assert h.get('v2_production_autonomy_enabled') is False, h
          assert h.get('autonomy_allowed_trigger')=='founder-command', h
          assert v2.get('status')=='READY' and v2.get('production_autonomy_enabled') is False, v2
          assert eg.get('status')=='READY' and eg.get('production_autonomy_enabled') is False, eg
          assert hermes.get('status')=='READY_FOR_COMMAND_ACCEPTANCE', hermes
          provider=hermes.get('rio_central_image_provider') or {}
          assert provider.get('workers_ai_binding_configured') is True, provider
          assert provider.get('asset_store_configured') is True, provider
          assert provider.get('credential_transfer_required') is False, provider
          assert provider.get('ready_for_preflight') is True, provider
          assert proxy.get('status')=='READY', proxy
          assert wh.get('status')=='WEBHOOK_CONFIGURED_MATCHING', wh
          assert wh.get('webhook_url_matches_expected') is True, wh
          print(json.dumps({'status':'LIVE_PROXY_AWARE_DEPLOYMENT_VERIFIED','git_sha':h.get('deployment_git_sha'),'cloudflare_version_id':h.get('cloudflare_version_id'),'edge_proxy_ready':True,'telegram_webhook_matching':True,'central_workers_ai_binding_ready':True,'provider_inference_performed':False,'production_autonomy_enabled':False,'consequential_trigger':'founder-command','synthetic_founder_event_used':False},indent=2))
          PY
