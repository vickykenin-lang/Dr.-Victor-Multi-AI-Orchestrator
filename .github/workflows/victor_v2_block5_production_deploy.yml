name: Victor V2 Block 5 Production Deploy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/victor_v2_block5_production_deploy.yml'
      - 'victor-telegram-worker/worker.js'
      - 'victor-telegram-worker/endgame_runtime_acceptance.mjs'
      - 'brain/endgame_runtime_gate.mjs'
      - 'brain/procedure_registry.mjs'
      - 'brain/degraded_mode.mjs'
      - 'brain/truthful_telemetry.mjs'
      - 'brain/experience_ledger.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: d027de83cb964eb66fa56ffed27c0b27
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WORKER_NAME: victor-telegram-webhook
      WORKER_BASE_URL: https://victor-telegram-webhook.vickykenin.workers.dev
      TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
      VICTOR_FOUNDER_CHAT_ID: ${{ secrets.VICTOR_FOUNDER_CHAT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Require protected Cloudflare deploy credential
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo 'CLOUDFLARE_API_TOKEN repository secret is not configured.' >&2
            exit 42
          fi
      - name: Install pinned toolchain
        run: npm ci
      - name: Regression gate before production
        run: |
          node --check victor-telegram-worker/worker.js
          node --check victor-telegram-worker/endgame_runtime_acceptance.mjs
          node --test brain/founder_intent_gateway.test.mjs brain/security_kernel.test.mjs brain/action_contract.test.mjs brain/block3_sandbox_security.test.mjs brain/block4_promotion_shadow.test.mjs brain/block5_redteam_security.test.mjs victor-telegram-worker/endgame_runtime_acceptance.test.mjs
      - name: Build exact Worker module bundle
        run: |
          rm -rf dist/v2-live
          npx wrangler deploy --dry-run --outdir dist/v2-live
          test -s dist/v2-live/worker.js
          node --check dist/v2-live/worker.js
      - name: Replace Worker content only, preserve bindings and config
        shell: bash
        run: |
          cat > /tmp/metadata.json <<'JSON'
          {"main_module":"worker.js"}
          JSON
          HTTP=$(curl --silent --show-error --output /tmp/cf-response.json --write-out '%{http_code}' \
            --request PUT \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --form 'metadata=@/tmp/metadata.json;type=application/json' \
            --form 'worker.js=@dist/v2-live/worker.js;type=application/javascript+module' \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/content")
          python - "$HTTP" <<'PY'
          import json,sys
          code=int(sys.argv[1])
          body=json.load(open('/tmp/cf-response.json'))
          if code != 200 or body.get('success') is not True:
              print(json.dumps({'http_status':code,'success':body.get('success'),'errors':body.get('errors',[])},indent=2))
              raise SystemExit(1)
          result=body.get('result') or {}
          print(json.dumps({'http_status':code,'success':True,'etag':result.get('etag'),'modified_on':result.get('modified_on'),'has_modules':result.get('has_modules')},indent=2))
          PY
      - name: Verify live V2 runtime and END GAME health surfaces
        shell: bash
        run: |
          python - <<'PY'
          import json, os, time, urllib.request
          base=os.environ['WORKER_BASE_URL'].rstrip('/')
          required=['/health','/v2-health','/endgame-runtime-health','/core-health','/aura3-bridge-health','/tony-bridge-health','/telegram-webhook-health']
          results={}
          for path in required:
            last=None
            for _ in range(10):
              try:
                req=urllib.request.Request(base+path,headers={'User-Agent':'Victor-ENDGAME-Package2-Live-Verify/1.0'})
                with urllib.request.urlopen(req,timeout=20) as r:
                  body=json.loads(r.read().decode())
                  last={'http_status':r.status,'body':body}
                  if r.status==200: break
              except Exception as e:
                last={'http_status':None,'error':str(e)[:300]}
              time.sleep(3)
            results[path]=last
          assert all(v.get('http_status')==200 for v in results.values()), results
          v2=results['/v2-health']['body']
          assert v2.get('status')=='READY', v2
          assert v2.get('runtime_wired') is True, v2
          assert v2.get('founder_stop_precedence') is True, v2
          assert v2.get('red_credential_without_founder')=='DENY', v2
          assert v2.get('production_autonomy_enabled') is False, v2
          endgame=results['/endgame-runtime-health']['body']
          assert endgame.get('status')=='READY', endgame
          assert endgame.get('degraded_mode')=='DEGRADED_VERIFIED_PROCEDURE', endgame
          assert endgame.get('truthful_telemetry_surface')=='LIVE', endgame
          assert endgame.get('experience_ledger_durable') is True, endgame
          assert endgame.get('production_autonomy_enabled') is False, endgame
          health=results['/health']['body']
          assert health.get('v2_runtime_wired') is True, health
          assert health.get('v2_production_autonomy_enabled') is False, health
          print(json.dumps({'status':'LIVE_ENDGAME_PACKAGE2_HEALTH_VERIFIED','source_git_sha':os.environ.get('GITHUB_SHA'),'results':results},indent=2))
          PY
      - name: Founder-authorized END GAME Package 2 live acceptance
        shell: bash
        run: |
          python - <<'PY'
          import json, os, urllib.request
          if not os.environ.get('TELEGRAM_WEBHOOK_SECRET') or not os.environ.get('VICTOR_FOUNDER_CHAT_ID'):
              raise SystemExit('Protected Founder acceptance secrets are not configured')
          base=os.environ['WORKER_BASE_URL'].rstrip('/')
          founder=str(os.environ['VICTOR_FOUNDER_CHAT_ID'])
          payload={
              'update_id': 926092502,
              'message': {
                  'message_id': 0,
                  'from': {'id': int(founder)},
                  'chat': {'id': int(founder), 'type': 'private'},
                  'text': 'ENDGAME RUNTIME ACCEPTANCE',
              },
          }
          req=urllib.request.Request(
              base+'/telegram',
              data=json.dumps(payload).encode(),
              method='POST',
              headers={
                  'Content-Type':'application/json',
                  'X-Telegram-Bot-Api-Secret-Token':os.environ['TELEGRAM_WEBHOOK_SECRET'],
                  'User-Agent':'Victor-ENDGAME-Package2-Live-Acceptance/1.0',
              },
          )
          with urllib.request.urlopen(req,timeout=45) as r:
              body=json.loads(r.read().decode())
              code=r.status
          safe={
              'http_status':code,
              'mode':body.get('mode'),
              'status':body.get('status'),
              'procedure_registry_live':body.get('procedure_registry_live'),
              'degraded_mode_live':body.get('degraded_mode_live'),
              'truthful_telemetry_live':body.get('truthful_telemetry_live'),
              'experience_ledger_readback_verified':body.get('experience_ledger_readback_verified'),
              'experience_advisory_reuse_verified':body.get('experience_advisory_reuse_verified'),
              'cognee_semantic_roundtrip_verified':body.get('cognee_semantic_roundtrip_verified'),
              'cognee_result_count':body.get('cognee_result_count'),
              'blockers':body.get('blockers'),
              'production_autonomy_enabled':body.get('production_autonomy_enabled'),
              'secrets_exposed':body.get('secrets_exposed'),
          }
          print(json.dumps(safe,indent=2))
          assert code==200, safe
          assert body.get('mode')=='ENDGAME_RUNTIME_ACCEPTANCE', safe
          assert body.get('status')=='PASS', safe
          assert body.get('procedure_registry_live') is True, safe
          assert body.get('degraded_mode_live') is True, safe
          assert body.get('truthful_telemetry_live') is True, safe
          assert body.get('experience_ledger_readback_verified') is True, safe
          assert body.get('experience_advisory_reuse_verified') is True, safe
          assert body.get('cognee_semantic_roundtrip_verified') is True, safe
          assert body.get('production_autonomy_enabled') is False, safe
          assert body.get('secrets_exposed') is False, safe
          PY
