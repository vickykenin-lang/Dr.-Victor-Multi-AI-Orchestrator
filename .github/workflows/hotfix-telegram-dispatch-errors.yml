name: Hotfix Telegram Dispatch Errors

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hotfix-telegram-dispatch-errors.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fix dispatch error handling and Telegram retries
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('victor-telegram-worker/worker.js')
          s = p.read_text(encoding='utf-8')

          # Wrap each simplified department dispatch so a bridge failure is reported once
          # and does not bubble into a generic 500 that Telegram retries repeatedly.
          replacements = {
          """          const dispatch = await dispatchRioTask(env, text, { messageId: message.message_id });\n          await sendTelegramMessage(env, chatId, `RIO ko task de diya. Task ID: ${dispatch.taskId}.`, message.message_id);\n          ctx?.waitUntil(handleRioRoundTrip(env, chatId, dispatch, message.message_id));\n          return json({ ok: true, mode: plan.mode, target, task_id: dispatch.taskId });""":
          """          let dispatch;\n          try {\n            dispatch = await dispatchRioTask(env, text, { messageId: message.message_id });\n          } catch (error) {\n            console.error('RIO dispatch failed:', safeErrorMessage(error));\n            await sendTelegramMessage(env, chatId, 'RIO ko task dispatch nahi hua. Victor ne failure record kiya hai; duplicate retry nahi karega.', message.message_id);\n            return json({ ok: true, mode: plan.mode, target, dispatch: 'FAILED' });\n          }\n          await sendTelegramMessage(env, chatId, `RIO ko task de diya. Task ID: ${dispatch.taskId}.`, message.message_id);\n          ctx?.waitUntil(handleRioRoundTrip(env, chatId, dispatch, message.message_id));\n          return json({ ok: true, mode: plan.mode, target, task_id: dispatch.taskId });""",
          """          const dispatch = await dispatchTonyTask(env, text, { messageId: message.message_id });\n          await sendTelegramMessage(env, chatId, `Tony ko task de diya. Task ID: ${dispatch.taskId}.`, message.message_id);\n          ctx?.waitUntil(handleTonyRoundTrip(env, chatId, dispatch, message.message_id));\n          return json({ ok: true, mode: plan.mode, target, task_id: dispatch.taskId });""":
          """          let dispatch;\n          try {\n            dispatch = await dispatchTonyTask(env, text, { messageId: message.message_id });\n          } catch (error) {\n            console.error('Tony dispatch failed:', safeErrorMessage(error));\n            await sendTelegramMessage(env, chatId, 'Tony ko task dispatch nahi hua. Victor ne failure record kiya hai; duplicate retry nahi karega.', message.message_id);\n            return json({ ok: true, mode: plan.mode, target, dispatch: 'FAILED' });\n          }\n          await sendTelegramMessage(env, chatId, `Tony ko task de diya. Task ID: ${dispatch.taskId}.`, message.message_id);\n          ctx?.waitUntil(handleTonyRoundTrip(env, chatId, dispatch, message.message_id));\n          return json({ ok: true, mode: plan.mode, target, task_id: dispatch.taskId });""",
          """          const dispatch = await dispatchAura3Task(env, text, { messageId: message.message_id });\n          await sendTelegramMessage(env, chatId, `AURA3 ko task de diya. Task ID: ${dispatch.taskId}.`, message.message_id);\n          ctx?.waitUntil(handleAura3RoundTrip(env, chatId, dispatch, message.message_id));\n          return json({ ok: true, mode: plan.mode, target, task_id: dispatch.taskId });""":
          """          let dispatch;\n          try {\n            dispatch = await dispatchAura3Task(env, text, { messageId: message.message_id });\n          } catch (error) {\n            console.error('AURA3 dispatch failed:', safeErrorMessage(error));\n            await sendTelegramMessage(env, chatId, 'AURA3 ko task dispatch nahi hua. Victor ne failure record kiya hai; duplicate retry nahi karega.', message.message_id);\n            return json({ ok: true, mode: plan.mode, target, dispatch: 'FAILED' });\n          }\n          await sendTelegramMessage(env, chatId, `AURA3 ko task de diya. Task ID: ${dispatch.taskId}.`, message.message_id);\n          ctx?.waitUntil(handleAura3RoundTrip(env, chatId, dispatch, message.message_id));\n          return json({ ok: true, mode: plan.mode, target, task_id: dispatch.taskId });""",
          }

          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit('DISPATCH_ANCHOR_NOT_FOUND')
              s = s.replace(old, new, 1)

          # Any authenticated Telegram update that has already received an error reply must
          # return HTTP 200, otherwise Telegram retries the same update and duplicates replies.
          old = """      return json({ ok: false, error: diagnostic.category, trace_id: traceId }, 500);"""
          new = """      return json({ ok: false, error: diagnostic.category, trace_id: traceId, acknowledged: true }, 200);"""
          if old not in s:
              raise SystemExit('ERROR_ACK_ANCHOR_NOT_FOUND')
          s = s.replace(old, new, 1)

          # Make stage diagnostics accurate if an unexpected department execution error remains.
          old2 = """  else if (!knownCode && stage === 'DEPARTMENT_ROUTING') category = 'DEPARTMENT_ROUTING_FAILED';"""
          new2 = """  else if (!knownCode && ['DEPARTMENT_ROUTING', 'DEPARTMENT_EXECUTION'].includes(stage)) category = 'DEPARTMENT_ROUTING_FAILED';"""
          if old2 in s:
              s = s.replace(old2, new2, 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Validate
        run: |
          node --check victor-telegram-worker/worker.js
          node --test victor-telegram-worker/core_rules.test.mjs victor-telegram-worker/memory_runtime.test.mjs victor-telegram-worker/autonomy_runtime.test.mjs brain/runtime.test.mjs
      - name: Persist and remove hotfix workflow
        run: |
          rm -f .github/workflows/hotfix-telegram-dispatch-errors.yml
          git config user.name "victor-runtime-hotfix"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix: acknowledge Telegram errors and contain department dispatch failures"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
