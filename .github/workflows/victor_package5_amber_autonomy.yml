name: Victor Package 5 AMBER Autonomy

on:
  push:
    branches: [main]
    paths:
      - 'brain/amber_autonomy.mjs'
      - 'brain/amber_autonomy.test.mjs'
      - '.github/workflows/victor_package5_amber_autonomy.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  governed-amber-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
      - name: Validate AMBER controller
        run: node brain/amber_autonomy.test.mjs
      - name: Verify AMBER boundaries remain fail-closed
        run: |
          node - <<'NODE'
          import { evaluateSecurityRequest } from './brain/security_kernel.mjs';
          const red=['credential.rotate','security.policy.change','authority.expand','production.destructive_change','pause.override'];
          for (const capability_id of red) {
            const r=evaluateSecurityRequest({actor:'victor',capability_id,founder_approved:false,action_contract_authorized:true});
            if (r.decision !== 'DENY') throw new Error(`RED_NOT_DENIED:${capability_id}`);
          }
          console.log('RED_BOUNDARIES_DENIED');
          NODE
      - name: Verify rollback path is mandatory
        run: |
          node - <<'NODE'
          import { buildAmberExecutionLease, evaluateAmberAction } from './brain/amber_autonomy.mjs';
          const now=Date.now();
          const lease=buildAmberExecutionLease({leaseId:'ci-amber',expiresAtUtc:new Date(now+3600000).toISOString()});
          const r=evaluateAmberAction({capabilityId:'production.reversible_change',actionContractAuthorized:true,lease,rollback:null,sandboxReceipt:{status:'TEST_PASSED',evidence_refs:['ci'],production_applied:false,promotion_required:true},deploymentIdentity:{source_sha:process.env.GITHUB_SHA,build_id:process.env.GITHUB_RUN_ID},nowMs:now});
          if (r.decision !== 'DENY') throw new Error('ROLLBACK_CONTRACT_NOT_ENFORCED');
          console.log('ROLLBACK_CONTRACT_ENFORCED');
          NODE
      - name: Execute reversible AMBER branch canary
        env:
          CANARY_BRANCH: victor-amber-canary-${{ github.run_id }}
        run: |
          set -euo pipefail
          trap 'git push origin --delete "$CANARY_BRANCH" >/dev/null 2>&1 || true' EXIT
          git config user.name "Victor AMBER Canary"
          git config user.email "actions@users.noreply.github.com"
          git checkout -b "$CANARY_BRANCH"
          mkdir -p .victor-canary
          printf '%s\n' "run_id=${GITHUB_RUN_ID}" "source_sha=${GITHUB_SHA}" "scope=repo.branch.write" > .victor-canary/amber.txt
          git add .victor-canary/amber.txt
          git commit -m "test: Victor AMBER reversible branch canary"
          git push origin HEAD:"$CANARY_BRANCH"
          git ls-remote --exit-code --heads origin "$CANARY_BRANCH" >/dev/null
          git push origin --delete "$CANARY_BRANCH"
          if git ls-remote --heads origin "$CANARY_BRANCH" | grep -q .; then
            echo 'AMBER_ROLLBACK_FAILED: branch still exists' >&2
            exit 1
          fi
          trap - EXIT
          echo 'AMBER_BRANCH_CANARY_AND_ROLLBACK_VERIFIED'
