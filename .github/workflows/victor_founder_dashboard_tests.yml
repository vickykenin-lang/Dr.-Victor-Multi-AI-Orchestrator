name: Victor Founder Dashboard Tests

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'tests/test_founder_dashboard.py'
      - '.github/workflows/victor_founder_dashboard_tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dashboard-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.x'
      - name: Verify Founder dashboard truth and UI contract
        run: python -m unittest tests/test_founder_dashboard.py
