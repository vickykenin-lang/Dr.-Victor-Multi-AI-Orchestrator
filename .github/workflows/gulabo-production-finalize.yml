name: Gulabo Production Finalize

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gulabo-production-finalize.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_ACCOUNT_ID: d027de83cb964eb66fa56ffed27c0b27
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WORKER_NAME: victor-telegram-webhook
      GULABO_API_BASE_URL: https://api.designinfra.in/gulabo
      EXPECTED_GIT_SHA: 43bd8179813d6b06d73dcb1767f2e4cfed9efac8
    steps:
      - name: Require deploy credential
        shell: bash
        run: test -n "$CLOUDFLARE_API_TOKEN"

      - name: Stamp Gulabo production URL while preserving all bindings
        shell: bash
        run: |
          set -euo pipefail
          HTTP=$(curl --silent --show-error --output /tmp/settings.json --write-out '%{http_code}' \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/settings")
          python3 - "$HTTP" "$GULABO_API_BASE_URL" <<'PY'
          import json,sys
          code=int(sys.argv[1]); url=sys.argv[2]; body=json.load(open('/tmp/settings.json'))
          if code != 200 or body.get('success') is not True: raise SystemExit(f'SETTINGS_READ_FAILED:{code}')
          bindings=(body.get('result') or {}).get('bindings') or []
          out=[]; seen=set()
          for b in bindings:
              name=b.get('name')
              if not name or name=='GULABO_API_BASE_URL' or name in seen: continue
              seen.add(name)
              out.append({'name':name,'type':'inherit','version_id':'latest'})
          out.append({'name':'GULABO_API_BASE_URL','type':'plain_text','text':url})
          json.dump({'bindings':out},open('/tmp/settings-patch.json','w'),separators=(',',':'))
          print(json.dumps({'bindings_preserved':len(out)-1,'gulabo_url_binding':'prepared'}))
          PY
          HTTP=$(curl --silent --show-error --output /tmp/patch.json --write-out '%{http_code}' \
            --request PATCH \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --form 'settings=@/tmp/settings-patch.json;type=application/json' \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/settings")
          python3 - "$HTTP" <<'PY'
          import json,sys
          code=int(sys.argv[1]); body=json.load(open('/tmp/patch.json'))
          if code != 200 or body.get('success') is not True:
              print(json.dumps({'http_status':code,'errors':body.get('errors',[])},indent=2)); raise SystemExit(1)
          print('GULABO_URL_BINDING_STAMPED')
          PY

      - name: Verify Worker bindings and deployment identity
        shell: bash
        run: |
          set -euo pipefail
          HTTP=$(curl --silent --show-error --output /tmp/settings-verify.json --write-out '%{http_code}' \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/settings")
          python3 - "$HTTP" "$GULABO_API_BASE_URL" "$EXPECTED_GIT_SHA" <<'PY'
          import json,sys
          code=int(sys.argv[1]); url=sys.argv[2]; sha=sys.argv[3]; body=json.load(open('/tmp/settings-verify.json'))
          if code != 200 or body.get('success') is not True: raise SystemExit(f'SETTINGS_VERIFY_FAILED:{code}')
          bindings=(body.get('result') or {}).get('bindings') or []
          by={b.get('name'):b for b in bindings}
          required=['GULABO_HERMES_COMMAND_TOKEN','GULABO_HERMES_COMMAND_SECRET','GULABO_HERMES_CALLBACK_TOKEN','GULABO_HERMES_CALLBACK_SECRET']
          missing=[x for x in required if by.get(x,{}).get('type')!='secret_text']
          assert not missing, missing
          assert by.get('GULABO_API_BASE_URL',{}).get('type')=='plain_text'
          assert by.get('GULABO_API_BASE_URL',{}).get('text')==url
          assert by.get('VICTOR_DEPLOY_GIT_SHA',{}).get('text')==sha
          assert by.get('AI',{}).get('type')=='ai'
          print(json.dumps({'status':'GULABO_WORKER_BINDINGS_VERIFIED','gulabo_api_base_url':url,'dedicated_secret_bindings':4,'deploy_git_sha':sha,'workers_ai':True},indent=2))
          PY

      - name: Verify stable live primary identity
        shell: bash
        run: |
          python3 - <<'PY'
          import json,os,time,urllib.request
          url='https://victor-telegram-webhook.vickykenin.workers.dev/health'
          expected=os.environ['EXPECTED_GIT_SHA']; consecutive=0; samples=[]
          for _ in range(30):
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Gulabo-Part5-Finalizer/1.0','Cache-Control':'no-cache'})
                  with urllib.request.urlopen(req,timeout=15) as r:
                      body=json.loads(r.read().decode()); got=body.get('deployment_git_sha'); samples.append(got)
                      consecutive = consecutive + 1 if r.status==200 and got==expected else 0
                      if consecutive >= 3:
                          print(json.dumps({'status':'STABLE_LIVE_IDENTITY_VERIFIED','git_sha':expected,'consecutive_matches':consecutive,'cloudflare_version_id':body.get('cloudflare_version_id')},indent=2)); raise SystemExit(0)
              except Exception as e:
                  samples.append(type(e).__name__); consecutive=0
              time.sleep(2)
          print(json.dumps({'status':'STABLE_IDENTITY_NOT_VERIFIED','expected':expected,'last_samples':samples[-10:]},indent=2)); raise SystemExit(1)
          PY
