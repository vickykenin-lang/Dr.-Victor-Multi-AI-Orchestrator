name: Vision Production House Engine

on:
  workflow_dispatch:
    inputs:
      action:
        description: "create_job | run_stage | auto | topic_ok | look_ok | master_ok"
        required: true
        default: "auto"
      job_id:
        description: "JOB001"
        required: true
      topic:
        required: false
        default: ""
      length:
        required: false
        default: "10min"
      language:
        required: false
        default: "Hinglish"
      platform:
        required: false
        default: "youtube"

permissions:
  contents: write
  actions: write

jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run production engine
        env:
          ENGINE_ACTION: ${{ inputs.action }}
          JOB_ID: ${{ inputs.job_id }}
          TOPIC: ${{ inputs.topic }}
          LENGTH: ${{ inputs.length }}
          LANGUAGE: ${{ inputs.language }}
          PLATFORM: ${{ inputs.platform }}
        run: python3 vision/scripts/production_engine.py

      - name: Commit job state
        if: always()
        run: |
          git config user.name vision-engine
          git config user.email vision-engine@users.noreply.github.com
          git add vision/engine/jobs/ || true
          if git diff --staged --quiet; then echo nothing; else
            git commit -m "engine: ${{ inputs.action }} ${{ inputs.job_id }}"
            git pull --rebase origin main || git pull --rebase --autostash origin main || true
            git push
          fi

      - name: Auto trigger next stage after gap
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_ID: ${{ inputs.job_id }}
        run: |
          SIG="vision/engine/jobs/${JOB_ID}/run_signal.json"
          if [ ! -f "$SIG" ]; then echo no signal; exit 0; fi
          CONT=$(python3 -c "import json;print(json.load(open('$SIG')).get('continue', False))")
          GAP=$(python3 -c "import json;print(int(json.load(open('$SIG')).get('gap_sec', 480)))")
          REASON=$(python3 -c "import json;print(json.load(open('$SIG')).get('reason',''))")
          echo continue=$CONT gap=$GAP reason=$REASON
          if [ "$CONT" != "True" ]; then echo stop; exit 0; fi
          echo "waiting ${GAP}s before next stage"
          sleep "$GAP"
          gh workflow run vision_engine.yml -r main -f action=auto -f job_id="$JOB_ID"
          echo queued next auto run
