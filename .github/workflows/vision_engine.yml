name: Vision Production House Engine

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      action:
        description: "create_job | run_stage | auto | scan_auto | reopen | topic_ok"
        required: false
        default: "scan_auto"
      job_id:
        required: false
        default: ""
      topic:
        required: false
        default: ""
      length:
        required: false
        default: "10min"
      language:
        required: false
        default: "Hinglish"
      platform:
        required: false
        default: "youtube"

permissions:
  contents: write
  actions: write

jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Run production engine
        env:
          ENGINE_ACTION: ${{ inputs.action || 'scan_auto' }}
          JOB_ID: ${{ inputs.job_id }}
          TOPIC: ${{ inputs.topic }}
          LENGTH: ${{ inputs.length }}
          LANGUAGE: ${{ inputs.language }}
          PLATFORM: ${{ inputs.platform }}
          GITHUB_SHA: ${{ github.sha }}
          KEI_I2V_KEY: ${{ secrets.KEI_I2V_KEY }}
          KIE_API_KEY: ${{ secrets.KIE_API_KEY }}
          SORA2_API: ${{ secrets.SORA2_API }}
          SORA2_API_KEY: ${{ secrets.SORA2_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_VIO_API_KEY: ${{ secrets.GEMINI_VIO_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NVIDIA_VICTOR_VISION_KEY: ${{ secrets.NVIDIA_VICTOR_VISION_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: python3 vision/scripts/production_engine.py
      - name: Commit job state
        if: always()
        run: |
          git config user.name vision-engine
          git config user.email vision-engine@users.noreply.github.com
          git add vision/engine/jobs/ || true
          if git diff --staged --quiet; then echo nothing; else
            git commit -m "engine: ${{ inputs.action || 'scan_auto' }} ${{ inputs.job_id }}"
            git pull --rebase origin main || git pull --rebase --autostash origin main || true
            git push
          fi
      - name: Auto trigger next after gap
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, glob, subprocess, time
          queued=set()
          for p in glob.glob("vision/engine/jobs/*/run_signal.json"):
              sig=json.load(open(p))
              if not sig.get("continue"): continue
              job=p.split("/")[3]
              if job in queued: continue
              gap=min(int(sig.get("gap_sec") or 60), 180)
              print("queue", job, "gap", gap)
              time.sleep(gap)
              subprocess.check_call(["gh","workflow","run","vision_engine.yml","-r","main","-f","action=auto","-f",f"job_id={job}"])
              queued.add(job)
          if not queued: print("no continue")
          PY
