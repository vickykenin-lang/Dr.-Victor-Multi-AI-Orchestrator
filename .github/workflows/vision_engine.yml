name: Vision Production House Engine

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      action:
        description: "create_job | run_stage | auto | scan_auto | topic_ok | look_ok | master_ok"
        required: false
        default: "scan_auto"
      job_id:
        description: "JOB001 or empty for scan_auto"
        required: false
        default: ""
      topic:
        required: false
        default: ""
      length:
        required: false
        default: "10min"
      language:
        required: false
        default: "Hinglish"
      platform:
        required: false
        default: "youtube"

permissions:
  contents: write
  actions: write

jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run production engine
        env:
          ENGINE_ACTION: ${{ inputs.action || 'scan_auto' }}
          JOB_ID: ${{ inputs.job_id }}
          TOPIC: ${{ inputs.topic }}
          LENGTH: ${{ inputs.length }}
          LANGUAGE: ${{ inputs.language }}
          PLATFORM: ${{ inputs.platform }}
        run: python3 vision/scripts/production_engine.py

      - name: Commit job state
        if: always()
        run: |
          git config user.name vision-engine
          git config user.email vision-engine@users.noreply.github.com
          git add vision/engine/jobs/ || true
          if git diff --staged --quiet; then echo nothing; else
            git commit -m "engine: ${{ inputs.action || 'scan_auto' }} ${{ inputs.job_id }}"
            git pull --rebase origin main || git pull --rebase --autostash origin main || true
            git push
          fi

      - name: Auto trigger next after gap
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess, time, glob
          paths = glob.glob("vision/engine/jobs/*/run_signal.json")
          queued = set()
          for p in paths:
              sig = json.load(open(p))
              if not sig.get("continue"):
                  continue
              job = p.split("/")[3]
              if job in queued:
                  continue
              gap = int(sig.get("gap_sec") or 60)
              print("queue", job, "gap", gap)
              time.sleep(min(gap, 300))
              subprocess.check_call(["gh", "workflow", "run", "vision_engine.yml", "-r", "main", "-f", "action=auto", "-f", f"job_id={job}"])
              queued.add(job)
          if not queued:
              print("no continue signals")
          PY
