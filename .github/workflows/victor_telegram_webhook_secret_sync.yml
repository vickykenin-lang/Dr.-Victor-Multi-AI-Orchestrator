name: Victor Telegram Webhook Secret Sync

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/victor_telegram_webhook_secret_sync.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-webhook-secret:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN_VICTOR: ${{ secrets.TELEGRAM_BOT_TOKEN_VICTOR }}
      TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
    steps:
      - name: Synchronize Telegram webhook secret without exposing credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TELEGRAM_BOT_TOKEN_VICTOR"
          test -n "$TELEGRAM_WEBHOOK_SECRET"
          python - <<'PY'
          import json, os, urllib.parse, urllib.request, urllib.error

          token = os.environ["TELEGRAM_BOT_TOKEN_VICTOR"]
          secret = os.environ["TELEGRAM_WEBHOOK_SECRET"]
          base = f"https://api.telegram.org/bot{token}"

          def api(method, payload=None):
              data = None if payload is None else urllib.parse.urlencode(payload).encode()
              req = urllib.request.Request(base + "/" + method, data=data)
              try:
                  with urllib.request.urlopen(req, timeout=45) as response:
                      body = json.load(response)
              except urllib.error.HTTPError as exc:
                  try:
                      body = json.loads(exc.read().decode("utf-8", "replace"))
                  except Exception:
                      body = {}
                  safe = {
                      "method": method,
                      "http_status": exc.code,
                      "error_code": body.get("error_code"),
                      "description": body.get("description"),
                      "credentials_exposed": False,
                  }
                  print(json.dumps(safe))
                  raise SystemExit(1)
              if body.get("ok") is not True:
                  print(json.dumps({
                      "method": method,
                      "error_code": body.get("error_code"),
                      "description": body.get("description"),
                      "credentials_exposed": False,
                  }))
                  raise SystemExit(1)
              return body.get("result") or {}

          before = api("getWebhookInfo")
          url = str(before.get("url") or "").strip()
          if not url:
              raise SystemExit("Existing Telegram webhook URL is missing; refusing to invent one.")

          # Keep the request minimal: preserve the current URL and rotate only secret_token.
          api("setWebhook", {"url": url, "secret_token": secret})
          after = api("getWebhookInfo")
          if str(after.get("url") or "").strip() != url:
              raise SystemExit("Webhook URL changed unexpectedly.")

          print(json.dumps({
              "ok": True,
              "webhook_configured": bool(after.get("url")),
              "pending_update_count": after.get("pending_update_count"),
              "last_error_present": bool(after.get("last_error_message")),
              "secret_value_exposed": False
          }))
          PY
