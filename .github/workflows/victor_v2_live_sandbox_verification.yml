name: Victor V2 Live Sandbox Verification
# run-marker: 2026-09-25-block5-final-evidence-permission-fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/victor_v2_live_sandbox_verification.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-live-sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
      - name: Pull disposable runtime image
        run: docker pull node:20-alpine
      - name: Execute isolated disposable sandbox
        run: |
          mkdir -p /tmp/victor-v2-sandbox-evidence
          chmod 0777 /tmp/victor-v2-sandbox-evidence
          docker run --rm \
            --name victor-v2-live-sandbox \
            --network none \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=32m \
            --memory 128m \
            --cpus 0.50 \
            --pids-limit 64 \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            -v "$PWD:/workspace:ro" \
            -v "/tmp/victor-v2-sandbox-evidence:/evidence:rw" \
            -w /workspace \
            node:20-alpine \
            node --input-type=module -e "
              import { createSandboxSpec, validateSandboxSpec, buildSandboxEvidenceReceipt } from './brain/sandbox_manager.mjs';
              const spec = createSandboxSpec({ objective_id: 'BLOCK5-LIVE-SANDBOX', action_id: 'ISOLATION-VERIFY', budgets: { runtime_seconds: 120, external_calls: 0, storage_mb: 32, spend_units: 0 } });
              const validation = validateSandboxSpec(spec);
              const riskyEnv = Object.keys(process.env).filter(k => /(TOKEN|SECRET|KEY|PASSWORD|CREDENTIAL)/i.test(k));
              if (!validation.valid) throw new Error(validation.reason);
              if (riskyEnv.length) throw new Error('CREDENTIAL_ENV_EXPOSED:' + riskyEnv.join(','));
              const receipt = buildSandboxEvidenceReceipt({ spec, status: 'TEST_PASSED', evidence_refs: ['github-actions:docker-network-none','docker:read-only-rootfs','docker:cap-drop-all','docker:no-new-privileges'] });
              const evidence = { schema_version: 1, verified_at_utc: new Date().toISOString(), runtime: 'github-hosted-runner/docker', network_mode: 'NONE', rootfs_read_only: true, tmpfs_mb: 32, memory_mb: 128, cpus: 0.5, pids_limit: 64, cap_drop: 'ALL', no_new_privileges: true, secret_like_env_present: false, sandbox_validation: validation, receipt, production_credentials_available: false, production_applied: false, teardown: 'AUTO_REMOVE_ON_EXIT', status: 'LIVE_ISOLATED_SANDBOX_VERIFIED' };
              await import('node:fs').then(fs => fs.writeFileSync('/evidence/evidence.json', JSON.stringify(evidence, null, 2)));
            "
          test -s /tmp/victor-v2-sandbox-evidence/evidence.json
      - name: Verify teardown and persist evidence
        run: |
          if docker ps -a --format '{{.Names}}' | grep -qx 'victor-v2-live-sandbox'; then
            echo 'Sandbox container still exists after --rm teardown' >&2
            exit 1
          fi
          mkdir -p data
          cp /tmp/victor-v2-sandbox-evidence/evidence.json data/v2_live_sandbox_evidence.json
          python - <<'PY'
          import json
          p='data/v2_live_sandbox_evidence.json'
          d=json.load(open(p))
          assert d['status']=='LIVE_ISOLATED_SANDBOX_VERIFIED'
          assert d['network_mode']=='NONE'
          assert d['rootfs_read_only'] is True
          assert d['secret_like_env_present'] is False
          assert d['production_credentials_available'] is False
          assert d['production_applied'] is False
          d['teardown_verified']=True
          open(p,'w').write(json.dumps(d,indent=2)+'\n')
          PY
      - name: Commit sandbox verification evidence
        run: |
          git config user.name 'victor-security-ops'
          git config user.email 'actions@users.noreply.github.com'
          git add data/v2_live_sandbox_evidence.json
          git commit -m 'evidence: verify Victor V2 live isolated sandbox'
          git pull --rebase origin main
          git push origin HEAD:main
