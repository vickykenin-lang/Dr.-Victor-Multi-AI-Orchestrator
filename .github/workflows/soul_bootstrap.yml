name: Victor SOUL Bootstrap

on:
  workflow_dispatch:
  push:
    paths:
      - 'VICTOR_SOUL.md'
      - 'AI_RUNTIME_MANIFEST.json'
      - 'scripts/soul_bootstrap.py'
      - 'scripts/telegram_health.py'
      - 'providers/**'
      - '.github/workflows/soul_bootstrap.yml'

permissions:
  contents: read

concurrency:
  group: victor-soul-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Compile bootstrap code
        run: |
          python -m py_compile \
            scripts/soul_bootstrap.py \
            scripts/telegram_health.py \
            providers/bedrock_mantle.py

      - name: Run safe SOUL provider bootstrap
        id: bootstrap
        env:
          API_VICTOR: ${{ secrets.API_VICTOR }}
        shell: bash
        run: |
          set +e
          python scripts/soul_bootstrap.py
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Run safe Telegram identity/chat health check
        id: telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN_VICTOR: ${{ secrets.TELEGRAM_BOT_TOKEN_VICTOR }}
          TELEGRAM_MANAGEMENT_CHAT_ID: ${{ secrets.TELEGRAM_MANAGEMENT_CHAT_ID }}
          TELEGRAM_CHAT_ID_VICTOR: ${{ secrets.TELEGRAM_CHAT_ID_VICTOR }}
          TELEGRAM_BOT_TOKEN_RIO: ${{ secrets.TELEGRAM_BOT_TOKEN_RIO }}
          TELEGRAM_CHAT_ID_RIO: ${{ secrets.TELEGRAM_CHAT_ID_RIO }}
          TELEGRAM_CHAT_ID_RIO_UI: ${{ secrets.TELEGRAM_CHAT_ID_RIO_UI }}
        shell: bash
        run: |
          set +e
          python scripts/telegram_health.py
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Print safe runtime summary
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          for path in ('data/ai_runtime_status.json', 'data/telegram_runtime_status.json'):
              p = Path(path)
              if not p.exists():
                  print(json.dumps({'status_file': path, 'state': 'MISSING'}))
                  continue
              d = json.loads(p.read_text())
              if path.endswith('ai_runtime_status.json'):
                  safe = {
                      'status_file': path,
                      'department': d.get('department'),
                      'state': d.get('state'),
                      'selected_provider': d.get('selected_provider'),
                      'selected_model': d.get('selected_model'),
                      'credential_presence': d.get('credential_presence'),
                      'secret_values_exposed': d.get('secret_values_exposed'),
                      'paid_inference_call': d.get('paid_inference_call'),
                  }
              else:
                  safe = {
                      'status_file': path,
                      'department': d.get('department'),
                      'state': d.get('state'),
                      'binding_scope': d.get('binding_scope'),
                      'binding_allowed': d.get('binding_allowed'),
                      'credential_presence': d.get('credential_presence'),
                      'bot_identity': d.get('bot_identity'),
                      'chat_health': d.get('chat_health'),
                      'secret_values_exposed': d.get('secret_values_exposed'),
                      'message_sent': d.get('message_sent'),
                      'updates_consumed': d.get('updates_consumed'),
                  }
              print(json.dumps(safe, ensure_ascii=False))
          PY

      - name: Upload bootstrap evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: victor-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            data/ai_runtime_status.json
            data/telegram_runtime_status.json
          if-no-files-found: error
          retention-days: 14

      - name: Persist non-secret runtime status
        if: always()
        shell: bash
        run: |
          test -f data/ai_runtime_status.json || { echo "AI runtime status missing"; exit 1; }
          test -f data/telegram_runtime_status.json || { echo "Telegram runtime status missing"; exit 1; }
          git config user.name "victor-runtime-bot"
          git config user.email "victor-runtime-bot@users.noreply.github.com"
          git add data/ai_runtime_status.json data/telegram_runtime_status.json
          if git diff --staged --quiet; then
            echo "No runtime status change"
          else
            git commit -m "runtime: record Victor provider and Telegram evidence"
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then
                exit 0
              fi
              echo "Runtime status push retry ${attempt}/3"
              sleep 2
            done
            echo "Failed to persist runtime status after retries"
            exit 1
          fi

      - name: Enforce verified AI readiness
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.bootstrap.outputs.rc }}" != "0" ]; then
            echo "SOUL provider bootstrap did not reach READY; see runtime status evidence."
            exit 1
          fi

      - name: Enforce verified Victor Telegram binding
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.telegram.outputs.rc }}" != "0" ]; then
            echo "Victor Telegram binding is not fully verified; see runtime status evidence."
            exit 1
          fi
