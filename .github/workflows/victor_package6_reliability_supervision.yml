name: Victor Package 6 Reliability Supervision

on:
  push:
    branches: [main]
    paths:
      - 'brain/reliability_supervisor.mjs'
      - 'brain/reliability_supervisor.test.mjs'
      - 'workers/victor-reliability-heartbeat/**'
      - '.github/workflows/victor_package6_reliability_supervision.yml'
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: victor-package6-reliability-supervision
  cancel-in-progress: false

jobs:
  bounded-supervision:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
      - name: Validate supervisor fail-closed behavior
        run: |
          node brain/reliability_supervisor.test.mjs
          node workers/victor-reliability-heartbeat/worker.test.mjs
      - name: Probe live Victor runtime and governed edge ingress
        shell: bash
        run: |
          set -euo pipefail
          PRIMARY='https://victor-telegram-webhook.vickykenin.workers.dev'
          EDGE='https://victor-edge-proxy.vickykenin.workers.dev'
          for p in health v2-health endgame-runtime-health core-health aura3-bridge-health tony-bridge-health; do
            code=$(curl -sS -o "/tmp/${p}.json" -w '%{http_code}' -A 'Victor-Package6-Reliability/2.0' "${PRIMARY}/${p}")
            test "$code" = '200'
          done
          for p in proxy-health telegram-webhook-health; do
            code=$(curl -sS -o "/tmp/${p}.json" -w '%{http_code}' -A 'Victor-Package6-Reliability/2.0' "${EDGE}/${p}")
            test "$code" = '200'
          done
          node - <<'NODE'
          const fs = require('fs');
          const health = JSON.parse(fs.readFileSync('/tmp/health.json','utf8'));
          const v2 = JSON.parse(fs.readFileSync('/tmp/v2-health.json','utf8'));
          const endgame = JSON.parse(fs.readFileSync('/tmp/endgame-runtime-health.json','utf8'));
          const proxy = JSON.parse(fs.readFileSync('/tmp/proxy-health.json','utf8'));
          const webhook = JSON.parse(fs.readFileSync('/tmp/telegram-webhook-health.json','utf8'));
          const ready = health.status === 'READY' && v2.status === 'READY' && endgame.status === 'READY' && proxy.status === 'READY';
          if (!ready) throw new Error('LIVE_RUNTIME_OR_EDGE_NOT_READY');
          if (webhook.status !== 'WEBHOOK_CONFIGURED_MATCHING' || webhook.webhook_url_matches_expected !== true) {
            throw new Error('GOVERNED_EDGE_WEBHOOK_NOT_MATCHING');
          }
          if (health.v2_production_autonomy_enabled === true || v2.production_autonomy_enabled === true || endgame.production_autonomy_enabled === true) {
            throw new Error('PRODUCTION_AUTONOMY_BOUNDARY_CHANGED');
          }
          const trigger = health.autonomy_allowed_trigger || 'founder-command';
          if (trigger !== 'founder-command') throw new Error(`TRIGGER_BOUNDARY_CHANGED:${trigger}`);
          console.log(JSON.stringify({status:'LIVE_SUPERVISION_SIGNAL_PASS',edge_proxy_ready:true,webhook_ingress_matching:true,production_autonomy_enabled:false,consequential_execution_trigger:'founder-command',historical_168h_certification:'FOUNDER_SKIPPED_NOT_CERTIFIED',secrets_exposed:false}));
          NODE
      - name: Exercise stale signal SAFE_HOLD drill
        run: |
          node --input-type=module - <<'NODE'
          import { evaluateSupervisionSignal } from './brain/reliability_supervisor.mjs';
          const now=Date.now();
          const result=evaluateSupervisionSignal({observed_at_ms:now,signal_at_ms:now-(31*60*1000),health_ok:true,v2_ready:true,endgame_ready:true,production_autonomy_enabled:false,consequential_trigger:'founder-command'});
          if (result.decision !== 'SAFE_HOLD' || result.production_action_allowed !== false) throw new Error('SAFE_HOLD_DRILL_FAILED');
          console.log(JSON.stringify(result));
          NODE
      - name: Exercise healthy GREEN-only recovery drill
        run: |
          node --input-type=module - <<'NODE'
          import { evaluateSupervisionSignal } from './brain/reliability_supervisor.mjs';
          const now=Date.now();
          const result=evaluateSupervisionSignal({observed_at_ms:now,signal_at_ms:now,health_ok:true,v2_ready:true,endgame_ready:true,production_autonomy_enabled:false,consequential_trigger:'founder-command'});
          const allowed=['repo.read','evidence.read','sandbox.execute'];
          if (result.decision !== 'CONTINUE_BOUNDED' || result.production_action_allowed !== false) throw new Error('GREEN_RECOVERY_NOT_BOUNDED');
          if (result.recovery_capabilities.some(x => !allowed.includes(x))) throw new Error('NON_GREEN_RECOVERY_CAPABILITY');
          console.log(JSON.stringify(result));
          NODE
