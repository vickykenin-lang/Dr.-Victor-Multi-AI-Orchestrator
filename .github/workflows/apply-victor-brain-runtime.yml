name: Apply Victor Brain Runtime

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_victor_brain_runtime.py'
      - 'scripts/apply_victor_brain_runtime_converged.py'
      - 'scripts/apply_victor_rio_bridge_fixes.py'
      - 'scripts/fix_autonomy_state_concurrency.py'
      - 'scripts/apply_founder_manual_trigger_fix.py'
      - 'scripts/apply_founder_intent_corrections.py'
      - 'scripts/apply_conversation_continuity_fix.py'
      - 'scripts/apply_hulk_routing_guard.py'
      - 'scripts/apply_active_thread_memory.py'
      - 'scripts/apply_contextual_investigation_fix.py'
      - 'scripts/apply_natural_founder_conversation.py'
      - 'scripts/apply_problem_ownership.py'
      - 'scripts/apply_fact_runtime.py'
      - 'scripts/apply_request_gateway.py'
      - 'scripts/apply_conversation_state_store.py'
      - 'scripts/apply_truth_resolver.py'
      - 'scripts/apply_outcome_state.py'
      - 'scripts/apply_execution_plan.py'
      - 'scripts/apply_model_truth_runtime.py'
      - 'scripts/apply_model_truth_runtime_converged.py'
      - 'scripts/apply_natural_reply_guard.py'
      - 'scripts/apply_cognee_auth_circuit_breaker.py'
      - 'brain/runtime.mjs'
      - 'brain/runtime.test.mjs'
      - 'brain/founder_intent.mjs'
      - 'brain/founder_intent.test.mjs'
      - 'brain/conversation_runtime.mjs'
      - 'brain/conversation_runtime.test.mjs'
      - 'brain/hulk_guard.mjs'
      - 'brain/hulk_guard.test.mjs'
      - 'brain/active_context.mjs'
      - 'brain/active_context.test.mjs'
      - 'brain/founder_conversation.mjs'
      - 'brain/founder_conversation.test.mjs'
      - 'brain/problem_ownership.mjs'
      - 'brain/problem_ownership.test.mjs'
      - 'brain/anti_bogus_runtime.mjs'
      - 'brain/anti_bogus_runtime.test.mjs'
      - 'brain/outcome_state.mjs'
      - 'brain/outcome_state.test.mjs'
      - 'brain/owned_outcome_acceptance.mjs'
      - 'brain/owned_outcome_acceptance.test.mjs'
      - 'brain/result_truth_receipts.mjs'
      - 'brain/result_truth_receipts.test.mjs'
      - 'brain/fact_runtime.mjs'
      - 'brain/fact_runtime.test.mjs'
      - 'brain/fact_evidence_resolver.mjs'
      - 'brain/truth_resolver.mjs'
      - 'brain/truth_resolver.test.mjs'
      - 'brain/founder_request.mjs'
      - 'brain/founder_request.test.mjs'
      - 'brain/request_gateway.mjs'
      - 'brain/request_gateway.test.mjs'
      - 'brain/execution_plan.mjs'
      - 'brain/execution_plan.test.mjs'
      - 'brain/conversation_state_store.mjs'
      - 'brain/conversation_state_store.test.mjs'
      - 'victor-telegram-worker/model_router.mjs'
      - 'victor-telegram-worker/model_router.test.mjs'
      - 'victor-telegram-worker/cognee_memory_bridge.mjs'
      - 'victor-telegram-worker/reply_integrity.mjs'
      - 'victor-telegram-worker/reply_integrity.test.mjs'
      - 'docs/VICTOR_FINAL_CORRECTION_PLAN.md'
      - 'data/victor_correction_backlog.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Apply runtime integration
        run: |
          python scripts/apply_victor_brain_runtime_converged.py
          python scripts/apply_victor_rio_bridge_fixes.py
          python scripts/fix_autonomy_state_concurrency.py
          python scripts/apply_founder_manual_trigger_fix.py
          python scripts/apply_founder_intent_corrections.py
          python scripts/apply_conversation_continuity_fix.py
          python scripts/apply_hulk_routing_guard.py
          python scripts/apply_active_thread_memory.py
          python scripts/apply_contextual_investigation_fix.py
          python scripts/apply_natural_founder_conversation.py
          python scripts/apply_problem_ownership.py
          python scripts/apply_fact_runtime.py
          python scripts/apply_request_gateway.py
          python scripts/apply_conversation_state_store.py
          python scripts/apply_truth_resolver.py
          python scripts/apply_outcome_state.py
          python scripts/apply_execution_plan.py
          python scripts/apply_model_truth_runtime_converged.py
          python scripts/apply_natural_reply_guard.py
          python scripts/apply_cognee_auth_circuit_breaker.py
      - name: Run core tests
        run: node --test brain/runtime.test.mjs brain/founder_intent.test.mjs brain/conversation_runtime.test.mjs brain/hulk_guard.test.mjs brain/active_context.test.mjs brain/founder_conversation.test.mjs brain/problem_ownership.test.mjs brain/anti_bogus_runtime.test.mjs brain/outcome_state.test.mjs brain/owned_outcome_acceptance.test.mjs brain/result_truth_receipts.test.mjs brain/fact_runtime.test.mjs brain/truth_resolver.test.mjs brain/founder_request.test.mjs brain/request_gateway.test.mjs brain/execution_plan.test.mjs brain/conversation_state_store.test.mjs victor-telegram-worker/model_router.test.mjs victor-telegram-worker/cognee_memory_bridge.test.mjs victor-telegram-worker/autonomy_runtime.test.mjs victor-telegram-worker/core_rules.test.mjs victor-telegram-worker/memory_runtime.test.mjs victor-telegram-worker/reply_integrity.test.mjs
      - name: Syntax checks
        run: |
          node --check brain/runtime.mjs
          node --check brain/founder_intent.mjs
          node --check brain/conversation_runtime.mjs
          node --check brain/hulk_guard.mjs
          node --check brain/active_context.mjs
          node --check brain/founder_conversation.mjs
          node --check brain/problem_ownership.mjs
          node --check brain/anti_bogus_runtime.mjs
          node --check brain/outcome_state.mjs
          node --check brain/owned_outcome_acceptance.mjs
          node --check brain/result_truth_receipts.mjs
          node --check brain/fact_runtime.mjs
          node --check brain/fact_evidence_resolver.mjs
          node --check brain/truth_resolver.mjs
          node --check brain/founder_request.mjs
          node --check brain/request_gateway.mjs
          node --check brain/execution_plan.mjs
          node --check brain/conversation_state_store.mjs
          node --check victor-telegram-worker/model_router.mjs
          node --check victor-telegram-worker/cognee_memory_bridge.mjs
          node --check victor-telegram-worker/reply_integrity.mjs
          node --check victor-telegram-worker/autonomy_runtime.mjs
          node --check victor-telegram-worker/department_bridge.mjs
          node --check victor-telegram-worker/worker.js
      - name: Validate correction backlog JSON
        run: python -m json.tool data/victor_correction_backlog.json >/dev/null
      - name: Persist integration if changed
        run: |
          git config user.name "victor-governed-runtime"
          git config user.email "actions@users.noreply.github.com"
          git add victor-telegram-worker/autonomy_runtime.mjs victor-telegram-worker/autonomy_runtime.test.mjs victor-telegram-worker/worker.js victor-telegram-worker/department_bridge.mjs victor-telegram-worker/model_router.mjs victor-telegram-worker/model_router.test.mjs victor-telegram-worker/cognee_memory_bridge.mjs brain/fact_runtime.mjs brain/anti_bogus_runtime.mjs brain/anti_bogus_runtime.test.mjs
          git diff --cached --quiet && exit 0
          git commit -m "runtime: apply Victor core integration"
          git pull --rebase --autostash
          git push
