name: Apply Victor Brain Runtime

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_victor_brain_runtime.py'
      - 'scripts/apply_victor_rio_bridge_fixes.py'
      - 'scripts/fix_autonomy_state_concurrency.py'
      - 'scripts/apply_founder_manual_trigger_fix.py'
      - 'scripts/apply_founder_intent_corrections.py'
      - 'scripts/apply_conversation_continuity_fix.py'
      - 'brain/runtime.mjs'
      - 'brain/runtime.test.mjs'
      - 'brain/founder_intent.mjs'
      - 'brain/founder_intent.test.mjs'
      - 'brain/conversation_runtime.mjs'
      - 'brain/conversation_runtime.test.mjs'
      - 'docs/VICTOR_FINAL_CORRECTION_PLAN.md'
      - 'data/victor_correction_backlog.json'
      - '.github/workflows/apply-victor-brain-runtime.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply runtime integration
        run: |
          python scripts/apply_victor_brain_runtime.py
          python scripts/apply_victor_rio_bridge_fixes.py
          python scripts/fix_autonomy_state_concurrency.py
          python scripts/apply_founder_manual_trigger_fix.py
          python scripts/apply_founder_intent_corrections.py
          python scripts/apply_conversation_continuity_fix.py
      - name: Run core tests
        run: node --test brain/runtime.test.mjs brain/founder_intent.test.mjs brain/conversation_runtime.test.mjs victor-telegram-worker/autonomy_runtime.test.mjs victor-telegram-worker/core_rules.test.mjs victor-telegram-worker/memory_runtime.test.mjs
      - name: Syntax checks
        run: |
          node --check brain/runtime.mjs
          node --check brain/founder_intent.mjs
          node --check brain/conversation_runtime.mjs
          node --check victor-telegram-worker/autonomy_runtime.mjs
          node --check victor-telegram-worker/department_bridge.mjs
          node --check victor-telegram-worker/worker.js
      - name: Validate correction backlog JSON
        run: python -m json.tool data/victor_correction_backlog.json >/dev/null
      - name: Persist integration if changed
        run: |
          git config user.name "victor-governed-runtime"
          git config user.email "actions@users.noreply.github.com"
          git add victor-telegram-worker/autonomy_runtime.mjs victor-telegram-worker/autonomy_runtime.test.mjs victor-telegram-worker/worker.js victor-telegram-worker/department_bridge.mjs
          git diff --cached --quiet && exit 0
          git commit -m "runtime: apply Victor core integration"
          git pull --rebase --autostash
          git push
