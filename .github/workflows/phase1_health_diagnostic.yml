name: Victor Phase 1 Health Diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase1_health_diagnostic.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch live health and persist sanitized release facts
        run: |
          set -euo pipefail
          git pull --rebase origin main
          body=$(curl -fsS --max-time 20 'https://victor-telegram-webhook.vickykenin.workers.dev/health')
          printf '%s' "$body" | jq '{service,status,deployment_git_sha,deployment_build_uuid,cloudflare_version_id,active_thread_memory,active_thread_memory_durable,active_thread_memory_reason,direct_consequential_department_execution,governed_diagnostic_department_bridge}' > data/phase1_live_health_diagnostic.json
          cat data/phase1_live_health_diagnostic.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/phase1_live_health_diagnostic.json
          git commit -m 'audit: capture Phase 1 live health diagnostic'
          git push origin HEAD:main
