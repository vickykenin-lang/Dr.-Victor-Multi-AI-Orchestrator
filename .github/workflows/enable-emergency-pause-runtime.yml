name: Enable Victor Emergency Pause Runtime

on:
  push:
    branches: [main]
    paths:
      - 'victor-telegram-worker/emergency_pause_runtime.mjs'
      - 'scripts/enable_emergency_pause_runtime.py'
      - '.github/workflows/enable-emergency-pause-runtime.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - run: python scripts/enable_emergency_pause_runtime.py
      - run: node --check victor-telegram-worker/worker.js && node --check victor-telegram-worker/autonomy_runtime.mjs && node --check victor-telegram-worker/emergency_pause_runtime.mjs
      - run: |
          set -e
          git config user.name "Victor Safety"
          git config user.email "actions@users.noreply.github.com"
          git add victor-telegram-worker/worker.js victor-telegram-worker/autonomy_runtime.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "safety: enforce Founder emergency pause in Victor runtime"
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; sleep $((attempt*2)); continue; }
            git push origin HEAD:main && exit 0
            sleep $((attempt*2))
          done
          exit 1
