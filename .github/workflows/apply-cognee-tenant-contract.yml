name: Apply Cognee Tenant Contract

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_cognee_tenant_contract.py'
      - 'victor-telegram-worker/model_router.mjs'
      - 'victor-telegram-worker/model_router.test.mjs'
      - 'victor-telegram-worker/cognee_memory_bridge.mjs'
      - 'victor-telegram-worker/cognee_memory_bridge.test.mjs'
      - 'victor-telegram-worker/memory_brain.mjs'
      - 'victor-telegram-worker/memory_brain.test.mjs'
      - 'victor-telegram-worker/worker.js'
      - 'wrangler.toml'
      - '.github/workflows/apply-cognee-tenant-contract.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply Cognee memory contract
        run: python scripts/apply_cognee_tenant_contract.py
      - name: Run Cognee and Memory Brain tests
        run: node --test victor-telegram-worker/model_router.test.mjs victor-telegram-worker/cognee_memory_bridge.test.mjs victor-telegram-worker/memory_brain.test.mjs
      - name: Syntax checks
        run: |
          node --check victor-telegram-worker/model_router.mjs
          node --check victor-telegram-worker/cognee_memory_bridge.mjs
          node --check victor-telegram-worker/memory_brain.mjs
          node --check victor-telegram-worker/worker.js
      - name: Persist governed memory integration if changed
        run: |
          git config user.name "victor-governed-runtime"
          git config user.email "actions@users.noreply.github.com"
          git add victor-telegram-worker/model_router.mjs victor-telegram-worker/model_router.test.mjs victor-telegram-worker/cognee_memory_bridge.mjs victor-telegram-worker/cognee_memory_bridge.test.mjs victor-telegram-worker/memory_brain.mjs victor-telegram-worker/memory_brain.test.mjs victor-telegram-worker/worker.js
          git diff --cached --quiet && exit 0
          git commit -m "runtime: apply Victor Memory Brain contract"
          git pull --rebase --autostash
          git push
