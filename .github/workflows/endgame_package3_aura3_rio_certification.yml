name: END GAME Package 3 AURA3 RIO Certification
# Rerun after safe AURA3 dispatch diagnostic production deploy: 2026-09-25

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/endgame_package3_aura3_rio_certification.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  WORKER_BASE_URL: https://victor-telegram-webhook.vickykenin.workers.dev
  TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
  VICTOR_FOUNDER_CHAT_ID: ${{ secrets.VICTOR_FOUNDER_CHAT_ID }}

jobs:
  rio-live-roundtrip:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Require protected Founder transport credentials
        shell: bash
        run: |
          if [ -z "$TELEGRAM_WEBHOOK_SECRET" ] || [ -z "$VICTOR_FOUNDER_CHAT_ID" ]; then
            echo 'Protected Founder transport secrets are not configured.' >&2
            exit 42
          fi
      - name: Execute fresh RIO governed round-trip
        shell: bash
        run: |
          python - <<'PY'
          import json, os, time, urllib.request
          base=os.environ['WORKER_BASE_URL'].rstrip('/')
          founder=str(os.environ['VICTOR_FOUNDER_CHAT_ID'])
          payload={'update_id':926092510,'message':{'message_id':0,'from':{'id':int(founder)},'chat':{'id':int(founder),'type':'private'},'text':'ENDGAME DEPARTMENT CERTIFY RIO'}}
          req=urllib.request.Request(base+'/telegram',data=json.dumps(payload).encode(),method='POST',headers={'Content-Type':'application/json','X-Telegram-Bot-Api-Secret-Token':os.environ['TELEGRAM_WEBHOOK_SECRET'],'User-Agent':'Victor-ENDGAME-Package3-RIO-Certification/3.0'})
          with urllib.request.urlopen(req,timeout=45) as r:
              body=json.loads(r.read().decode()); code=r.status
          safe={'http_status':code,'ok':body.get('ok'),'mode':body.get('mode'),'target':body.get('target'),'task_id':body.get('task_id')}
          print('RIO_DISPATCH='+json.dumps(safe,sort_keys=True))
          assert code==200 and body.get('ok') is True and body.get('mode')=='ENDGAME_DEPARTMENT_CERTIFICATION' and body.get('target')=='rio' and body.get('task_id'), safe
          task_id=body['task_id']
          url='https://raw.githubusercontent.com/vickykenin-lang/rio-affiliate-engine/main/integration/results/victor_tasks/'+task_id+'.json'
          result=None
          for _ in range(30):
              try:
                  q=urllib.request.Request(url+f'?t={int(time.time()*1000)}',headers={'User-Agent':'Victor-ENDGAME-Package3-RIO-Result/3.0','Cache-Control':'no-cache'})
                  with urllib.request.urlopen(q,timeout=20) as r:
                      candidate=json.loads(r.read().decode())
                      if candidate.get('task_id')==task_id: result=candidate; break
              except Exception: pass
              time.sleep(4)
          assert result is not None, {'status':'RIO_RESULT_TIMEOUT','task_id':task_id}
          s=result.get('strict_supervision') or {}
          checks={
              'task_id':result.get('task_id')==task_id,
              'sender':result.get('sender')=='rio',
              'recipient':result.get('recipient')=='victor',
              'message_type':result.get('message_type')=='TASK_RESULT',
              'no_public_action':result.get('public_action_performed') is False,
              'no_objective_change':result.get('objective_changed') is False,
              'no_credential_transfer':result.get('credential_transfer_performed') is False,
              'revert_to_victor':s.get('revert_to_victor') is True,
              'objective_alignment':bool(s.get('objective_alignment')),
              'status':bool(s.get('status')),
              'solution':bool(s.get('solution')),
              'next_action':bool(s.get('next_action')),
              'evidence':isinstance(s.get('evidence'),list) and len(s.get('evidence'))>0,
              'follow_up_explicit':isinstance(s.get('requires_follow_up'),bool),
          }
          out={'status':'PASS' if all(checks.values()) else 'FAIL','task_id':task_id,'verification':checks,'strict_status':s.get('status'),'evidence_count':len(s.get('evidence') or []),'secrets_exposed':False}
          print('RIO_CERTIFICATION='+json.dumps(out,indent=2))
          assert all(checks.values()), out
          PY

  aura3-live-roundtrip:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Require protected Founder transport credentials
        shell: bash
        run: |
          if [ -z "$TELEGRAM_WEBHOOK_SECRET" ] || [ -z "$VICTOR_FOUNDER_CHAT_ID" ]; then
            echo 'Protected Founder transport secrets are not configured.' >&2
            exit 42
          fi
      - name: Execute fresh AURA3 governed round-trip and diagnose dispatch failure safely
        shell: bash
        run: |
          python - <<'PY'
          import json, os, time, urllib.request, urllib.error
          base=os.environ['WORKER_BASE_URL'].rstrip('/')
          founder=str(os.environ['VICTOR_FOUNDER_CHAT_ID'])
          payload={'update_id':926092511,'message':{'message_id':0,'from':{'id':int(founder)},'chat':{'id':int(founder),'type':'private'},'text':'ENDGAME DEPARTMENT CERTIFY AURA3'}}
          req=urllib.request.Request(base+'/telegram',data=json.dumps(payload).encode(),method='POST',headers={'Content-Type':'application/json','X-Telegram-Bot-Api-Secret-Token':os.environ['TELEGRAM_WEBHOOK_SECRET'],'User-Agent':'Victor-ENDGAME-Package3-AURA3-Certification/3.0'})
          try:
              with urllib.request.urlopen(req,timeout=45) as r:
                  body=json.loads(r.read().decode()); code=r.status
          except urllib.error.HTTPError as e:
              raw=e.read().decode(errors='replace')[:500]
              try: parsed=json.loads(raw)
              except Exception: parsed={'error':'NON_JSON_ERROR'}
              safe={'http_status':e.code,'ok':parsed.get('ok'),'mode':parsed.get('mode'),'reason':parsed.get('reason') or parsed.get('error') or 'AURA3_DISPATCH_INTERNAL_ERROR'}
              print('AURA3_DISPATCH_BLOCKER='+json.dumps(safe,sort_keys=True))
              raise SystemExit(51)
          safe={'http_status':code,'ok':body.get('ok'),'mode':body.get('mode'),'target':body.get('target'),'task_id':body.get('task_id')}
          print('AURA3_DISPATCH='+json.dumps(safe,sort_keys=True))
          assert code==200 and body.get('ok') is True and body.get('mode')=='ENDGAME_DEPARTMENT_CERTIFICATION' and body.get('target')=='aura3' and body.get('task_id'), safe
          task_id=body['task_id']
          url='https://raw.githubusercontent.com/vickykenin-lang/aura-3.0/main/integration/results/tasks/'+task_id+'.json'
          result=None
          for _ in range(30):
              try:
                  q=urllib.request.Request(url+f'?t={int(time.time()*1000)}',headers={'User-Agent':'Victor-ENDGAME-Package3-AURA3-Result/3.0','Cache-Control':'no-cache'})
                  with urllib.request.urlopen(q,timeout=20) as r:
                      candidate=json.loads(r.read().decode())
                      if candidate.get('task_id')==task_id: result=candidate; break
              except Exception: pass
              time.sleep(4)
          assert result is not None, {'status':'AURA3_RESULT_TIMEOUT','task_id':task_id}
          s=result.get('strict_supervision') or {}
          checks={
              'task_id':result.get('task_id')==task_id,
              'sender':result.get('sender')=='aura3',
              'recipient':result.get('recipient')=='victor',
              'message_type':result.get('message_type')=='TASK_RESULT',
              'no_public_action':result.get('public_action_performed') is False,
              'revert_to_victor':s.get('revert_to_victor') is True,
              'objective_alignment':bool(s.get('objective_alignment')),
              'status':bool(s.get('status')),
              'solution':bool(s.get('solution')),
              'next_action':bool(s.get('next_action')),
              'evidence':isinstance(s.get('evidence'),list) and len(s.get('evidence'))>0,
          }
          out={'status':'PASS' if all(checks.values()) else 'FAIL','task_id':task_id,'verification':checks,'strict_status':s.get('status'),'evidence_count':len(s.get('evidence') or []),'secrets_exposed':False}
          print('AURA3_CERTIFICATION='+json.dumps(out,indent=2))
          assert all(checks.values()), out
          PY
