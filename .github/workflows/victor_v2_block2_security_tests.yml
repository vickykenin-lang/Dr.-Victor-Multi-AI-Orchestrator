name: Victor V2 Block 2 Security Tests

on:
  pull_request:
    paths:
      - 'brain/founder_intent_gateway.mjs'
      - 'brain/founder_intent_gateway.test.mjs'
      - 'brain/security_kernel.mjs'
      - 'brain/security_kernel.test.mjs'
      - '.github/workflows/victor_v2_block2_security_tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-authority-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
      - name: Syntax check
        run: |
          node --check brain/founder_intent_gateway.mjs
          node --check brain/security_kernel.mjs
      - name: Run Block 2 regression pack
        run: node --test brain/founder_intent_gateway.test.mjs brain/security_kernel.test.mjs
