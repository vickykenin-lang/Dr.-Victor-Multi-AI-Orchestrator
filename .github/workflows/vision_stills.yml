name: Vision EP001 Auto Stills

on:
  workflow_dispatch:
    inputs:
      only_ids:
        description: "e.g. A1"
        required: false
        default: "A1"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show env (safe)
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "repo=$GITHUB_REPOSITORY"
          if [ -n "$NVIDIA_API_KEY" ]; then echo "NVIDIA_API_KEY=SET"; else echo "NVIDIA_API_KEY=EMPTY"; fi
          if [ -n "$GEMINI_API_KEY" ]; then echo "GEMINI_API_KEY=SET"; else echo "GEMINI_API_KEY=EMPTY"; fi

      - name: Generate stills (Gemini primary)
        id: gemini
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ONLY_IDS: ${{ inputs.only_ids }}
        run: python3 vision/scripts/auto_generate_stills.py

      - name: Generate stills (NVIDIA fallback)
        if: steps.gemini.outcome != 'success'
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          ONLY_IDS: ${{ inputs.only_ids }}
        run: python3 vision/scripts/auto_generate_stills_nvidia.py

      - name: Upload stills + log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ep001-stills
          path: vision/episodes/EP001_Last_Delivery/stills/
          if-no-files-found: warn

      - name: Commit stills
        if: success()
        run: |
          git config user.name vision-bot
          git config user.email vision-bot@users.noreply.github.com
          git add vision/episodes/EP001_Last_Delivery/stills/ || true
          git diff --staged --quiet || git commit -m "vision: EP001 stills"
          git push || true
