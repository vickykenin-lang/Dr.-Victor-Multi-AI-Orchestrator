name: Vision EP001 Auto Stills

on:
  workflow_dispatch:
    inputs:
      only_ids:
        description: "e.g. A1"
        required: false
        default: "A1"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show env (safe)
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_VICTOR_VISION_KEY: ${{ secrets.NVIDIA_VICTOR_VISION_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          echo "repo=$GITHUB_REPOSITORY"
          if [ -n "$NVIDIA_API_KEY" ]; then echo "NVIDIA_API_KEY=SET"; else echo "NVIDIA_API_KEY=EMPTY"; fi
          if [ -n "$NVIDIA_VICTOR_VISION_KEY" ]; then echo "NVIDIA_VICTOR_VISION_KEY=SET"; else echo "NVIDIA_VICTOR_VISION_KEY=EMPTY"; fi
          if [ -n "$GEMINI_API_KEY" ]; then echo "GEMINI_API_KEY=SET"; else echo "GEMINI_API_KEY=EMPTY"; fi
          if [ -n "$GOOGLE_SERVICE_ACCOUNT_JSON" ]; then echo "DRIVE_SA=SET"; else echo "DRIVE_SA=EMPTY"; fi

      - name: Generate stills (Gemini primary)
        id: gemini
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ONLY_IDS: ${{ inputs.only_ids }}
        run: python3 vision/scripts/auto_generate_stills.py

      - name: Generate stills (NVIDIA fallback)
        if: always()
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_VICTOR_VISION_KEY: ${{ secrets.NVIDIA_VICTOR_VISION_KEY }}
          ONLY_IDS: ${{ inputs.only_ids }}
        run: |
          if ls vision/episodes/EP001_Last_Delivery/stills/*.png >/dev/null 2>&1; then
            echo "PNG already present; skip NVIDIA"
            exit 0
          fi
          python3 vision/scripts/auto_generate_stills_nvidia.py

      - name: Upload stills + log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ep001-stills
          path: vision/episodes/EP001_Last_Delivery/stills/
          if-no-files-found: warn

      - name: Commit stills to repo
        if: always()
        run: |
          git config user.name vision-bot
          git config user.email vision-bot@users.noreply.github.com
          git add vision/episodes/EP001_Last_Delivery/stills/ || true
          if git diff --staged --quiet; then
            echo "nothing to commit"
          else
            git commit -m "vision: EP001 stills"
            git pull --rebase origin main || git pull --rebase --autostash origin main || true
            git push
          fi

      - name: Upload to Google Drive 01_stills
        if: always()
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
        run: |
          if [ -z "$GOOGLE_SERVICE_ACCOUNT_JSON" ]; then
            echo "DRIVE_SA=EMPTY — skip Drive upload."
            exit 0
          fi
          python3 -m pip install -q google-auth
          python3 vision/scripts/upload_stills_drive.py
