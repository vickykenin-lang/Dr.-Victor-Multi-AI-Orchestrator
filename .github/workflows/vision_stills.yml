name: Vision EP001 Auto Stills

on:
  workflow_dispatch:
    inputs:
      only_ids:
        description: "e.g. A1 or A2"
        required: false
        default: "A1"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show env (safe)
        env:
          NVIDIA_VICTOR_VISION_KEY: ${{ secrets.NVIDIA_VICTOR_VISION_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "repo=$GITHUB_REPOSITORY only_ids=${{ inputs.only_ids }}"
          if [ -n "$NVIDIA_VICTOR_VISION_KEY" ] || [ -n "$NVIDIA_API_KEY" ]; then echo "NVIDIA=SET"; else echo "NVIDIA=EMPTY"; fi
          if [ -n "$GEMINI_API_KEY" ]; then echo "GEMINI_API_KEY=SET"; else echo "GEMINI_API_KEY=EMPTY"; fi

      - name: Generate stills (Gemini primary)
        id: gemini
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ONLY_IDS: ${{ inputs.only_ids }}
        run: python3 vision/scripts/auto_generate_stills.py

      - name: Generate stills (NVIDIA fallback)
        if: always()
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_VICTOR_VISION_KEY: ${{ secrets.NVIDIA_VICTOR_VISION_KEY }}
          ONLY_IDS: ${{ inputs.only_ids }}
        run: |
          missing=0
          IFS=',' read -ra IDS <<< "${ONLY_IDS:-A1}"
          for id in "${IDS[@]}"; do
            id=$(echo "$id" | tr -d ' ')
            if [ ! -f "vision/episodes/EP001_Last_Delivery/stills/${id}.png" ]; then
              missing=1
            fi
          done
          if [ "$missing" = "0" ]; then
            echo "requested IDs already on disk; skip NVIDIA"
            exit 0
          fi
          python3 vision/scripts/auto_generate_stills_nvidia.py

      - name: Upload stills + log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ep001-stills
          path: vision/episodes/EP001_Last_Delivery/stills/
          if-no-files-found: warn

      - name: Commit stills to repo
        if: always()
        run: |
          git config user.name vision-bot
          git config user.email vision-bot@users.noreply.github.com
          git add vision/episodes/EP001_Last_Delivery/stills/ || true
          if git diff --staged --quiet; then
            echo "nothing to commit"
          else
            git commit -m "vision: EP001 stills ${{ inputs.only_ids }}"
            git pull --rebase origin main || git pull --rebase --autostash origin main || true
            git push
          fi

      - name: Drive skipped
        run: echo "Google Drive OFF — stills stay on GitHub"
