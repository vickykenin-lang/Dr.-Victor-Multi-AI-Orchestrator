name: Victor Telegram Queue Topology Guard

on:
  workflow_run:
    workflows: ["Victor V2 Block 5 Production Deploy"]
    types: [completed]

permissions:
  contents: read

jobs:
  ensure-queue-topology:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_ACCOUNT_ID: d027de83cb964eb66fa56ffed27c0b27
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WORKER_NAME: victor-telegram-webhook
      QUEUE_NAME: victor-telegram-ingress
      QUEUE_BINDING: VICTOR_TELEGRAM_QUEUE
    steps:
      - name: Require protected Cloudflare credential
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'CLOUDFLARE_API_TOKEN is not configured' >&2; exit 42; }

      - name: Ensure Queue exists
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/queues" > /tmp/queues.json
          QUEUE_ID=$(python - <<'PY'
          import json, os
          body=json.load(open('/tmp/queues.json'))
          if body.get('success') is not True: raise SystemExit('QUEUE_LIST_FAILED')
          name=os.environ['QUEUE_NAME']
          for q in body.get('result') or []:
              if q.get('queue_name')==name:
                  print(q.get('queue_id') or '')
                  break
          PY
          )
          if [ -z "$QUEUE_ID" ]; then
            HTTP=$(curl --silent --show-error --output /tmp/queue-create.json --write-out '%{http_code}' \
              --request POST \
              --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              --header 'Content-Type: application/json' \
              --data "{\"queue_name\":\"${QUEUE_NAME}\"}" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/queues")
            QUEUE_ID=$(python - "$HTTP" <<'PY'
          import json,sys
          code=int(sys.argv[1]); body=json.load(open('/tmp/queue-create.json'))
          if code not in (200,201) or body.get('success') is not True:
              print(body.get('errors',[]),file=sys.stderr); raise SystemExit('QUEUE_CREATE_FAILED')
          print((body.get('result') or {}).get('queue_id') or '')
          PY
            )
          fi
          test -n "$QUEUE_ID"
          echo "QUEUE_ID=$QUEUE_ID" >> "$GITHUB_ENV"

      - name: Ensure Worker producer binding while inheriting protected bindings
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/settings" > /tmp/worker-settings.json
          python - <<'PY'
          import json,os
          body=json.load(open('/tmp/worker-settings.json'))
          if body.get('success') is not True: raise SystemExit('WORKER_SETTINGS_READ_FAILED')
          bindings=(body.get('result') or {}).get('bindings') or []
          inherited=[]; seen=set()
          target=os.environ['QUEUE_BINDING']
          for b in bindings:
              name=b.get('name')
              if not name or name==target or name in seen: continue
              seen.add(name); inherited.append({'name':name,'type':'inherit','version_id':'latest'})
          inherited.append({'name':target,'type':'queue','queue_name':os.environ['QUEUE_NAME']})
          json.dump({'bindings':inherited},open('/tmp/queue-binding-settings.json','w'),separators=(',',':'))
          PY
          BOUNDARY="----VictorQueueGuard${RANDOM}${RANDOM}"
          {
            printf -- '--%s\r\n' "$BOUNDARY"
            printf 'Content-Disposition: form-data; name="settings"\r\n'
            printf 'Content-Type: application/json\r\n\r\n'
            cat /tmp/queue-binding-settings.json
            printf '\r\n--%s--\r\n' "$BOUNDARY"
          } > /tmp/queue-binding-body
          HTTP=$(curl --silent --show-error --output /tmp/queue-binding-result.json --write-out '%{http_code}' \
            --request PATCH \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header "Content-Type: multipart/form-data; boundary=${BOUNDARY}" \
            --data-binary @/tmp/queue-binding-body \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/settings")
          python - "$HTTP" <<'PY'
          import json,sys
          code=int(sys.argv[1]); body=json.load(open('/tmp/queue-binding-result.json'))
          if code != 200 or body.get('success') is not True:
              print(body.get('errors',[])); raise SystemExit('QUEUE_BINDING_PATCH_FAILED')
          PY

      - name: Ensure Worker Queue consumer
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/queues/${QUEUE_ID}/consumers" > /tmp/consumers.json
          EXISTS=$(python - <<'PY'
          import json,os
          body=json.load(open('/tmp/consumers.json'))
          if body.get('success') is not True: raise SystemExit('QUEUE_CONSUMER_LIST_FAILED')
          print('yes' if any(c.get('script')==os.environ['WORKER_NAME'] or c.get('script_name')==os.environ['WORKER_NAME'] for c in body.get('result') or []) else 'no')
          PY
          )
          if [ "$EXISTS" != yes ]; then
            HTTP=$(curl --silent --show-error --output /tmp/consumer-create.json --write-out '%{http_code}' \
              --request POST \
              --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              --header 'Content-Type: application/json' \
              --data "{\"type\":\"worker\",\"script_name\":\"${WORKER_NAME}\",\"settings\":{\"batch_size\":1,\"max_retries\":3,\"max_wait_time_ms\":1000,\"retry_delay\":10}}" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/queues/${QUEUE_ID}/consumers")
            python - "$HTTP" <<'PY'
          import json,sys
          code=int(sys.argv[1]); body=json.load(open('/tmp/consumer-create.json'))
          if code not in (200,201) or body.get('success') is not True:
              print(body.get('errors',[])); raise SystemExit('QUEUE_CONSUMER_CREATE_FAILED')
          PY
          fi

      - name: Verify queue producer and consumer topology
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/queues" > /tmp/queues-final.json
          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/settings" > /tmp/settings-final.json
          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/queues/${QUEUE_ID}/consumers" > /tmp/consumers-final.json
          python - <<'PY'
          import json,os
          queues=json.load(open('/tmp/queues-final.json'))
          settings=json.load(open('/tmp/settings-final.json'))
          consumers=json.load(open('/tmp/consumers-final.json'))
          q=next((x for x in queues.get('result') or [] if x.get('queue_name')==os.environ['QUEUE_NAME']),None)
          if not q: raise SystemExit('QUEUE_TOPOLOGY_QUEUE_MISSING')
          binding=next((b for b in (settings.get('result') or {}).get('bindings') or [] if b.get('name')==os.environ['QUEUE_BINDING'] and b.get('type')=='queue' and b.get('queue_name')==os.environ['QUEUE_NAME']),None)
          if not binding: raise SystemExit('QUEUE_TOPOLOGY_PRODUCER_BINDING_MISSING')
          consumer=next((c for c in consumers.get('result') or [] if c.get('script')==os.environ['WORKER_NAME'] or c.get('script_name')==os.environ['WORKER_NAME']),None)
          if not consumer: raise SystemExit('QUEUE_TOPOLOGY_CONSUMER_MISSING')
          print(json.dumps({'status':'TELEGRAM_QUEUE_TOPOLOGY_VERIFIED','queue':os.environ['QUEUE_NAME'],'producer_binding':os.environ['QUEUE_BINDING'],'consumer_worker':os.environ['WORKER_NAME']},indent=2))
          PY
