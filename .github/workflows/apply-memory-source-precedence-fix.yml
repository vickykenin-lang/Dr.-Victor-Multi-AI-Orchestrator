name: Apply Memory Source Precedence Fix

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_memory_source_precedence_fix.py'
      - '.github/workflows/apply-memory-source-precedence-fix.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Apply precedence fix
        run: python scripts/apply_memory_source_precedence_fix.py
      - name: Syntax check
        run: node --check victor-telegram-worker/worker.js
      - name: Run memory tests
        run: |
          node --test victor-telegram-worker/cognee_memory_bridge.test.mjs
          node --test victor-telegram-worker/memory_brain.test.mjs
      - name: Guard semantic-memory precedence wording
        run: |
          grep -q "Mere absence from a department registry" victor-telegram-worker/worker.js
          grep -q "Absence from a registry" brain/fact_runtime.mjs
      - name: Persist patch if changed
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add brain/fact_runtime.mjs victor-telegram-worker/worker.js
            git commit -m "runtime: fix canonical-silence vs semantic-memory precedence"
            git push
          fi
