name: Victor Manual Readiness Reconciliation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: victor-heartbeat
  cancel-in-progress: false

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Victor soul readiness heartbeat
        run: python scripts/victor_heartbeat.py
      - name: Upload heartbeat evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: victor-heartbeat-${{ github.run_id }}
          path: data/victor_heartbeat_status.json
          if-no-files-found: error
          retention-days: 7
