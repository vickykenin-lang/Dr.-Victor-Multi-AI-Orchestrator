name: END GAME P0 Executive Reasoning Persist

on:
  push:
    branches:
      - 'endgame/p0-executive-reasoning-v1'
    paths:
      - 'scripts/apply_endgame_p0_reasoner_runtime.py'
      - '.github/workflows/endgame_p0_reasoner_persist.yml'

permissions:
  contents: write

jobs:
  apply-test-persist:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: endgame/p0-executive-reasoning-v1
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply Executive Reasoning Boundary runtime integration
        run: python scripts/apply_endgame_p0_reasoner_runtime.py
      - name: Run END GAME P0-1 through P0-3 tests
        run: >-
          node --test
          brain/action_contract.test.mjs
          brain/progress_contract.test.mjs
          brain/executive_reasoning.test.mjs
          victor-telegram-worker/department_bridge.test.mjs
          victor-telegram-worker/autonomy_runtime.test.mjs
      - name: Syntax check reasoning/runtime modules
        run: |
          node --check brain/action_contract.mjs
          node --check brain/progress_contract.mjs
          node --check brain/executive_reasoning.mjs
          node --check victor-telegram-worker/autonomy_runtime.mjs
      - name: Persist verified runtime integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add victor-telegram-worker/autonomy_runtime.mjs
          if git diff --cached --quiet; then
            echo 'Reasoner runtime integration already persisted.'
          else
            git commit -m 'endgame: integrate bounded Executive Reasoning Boundary V1'
            git push origin HEAD:endgame/p0-executive-reasoning-v1
          fi
