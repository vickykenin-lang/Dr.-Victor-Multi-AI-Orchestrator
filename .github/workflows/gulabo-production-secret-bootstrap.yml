name: Gulabo Production Secret Bootstrap

on:
  push:
    branches:
      - fix/gulabo-production-auth-fallback
    paths:
      - '.github/workflows/gulabo-production-secret-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_ACCOUNT_ID: d027de83cb964eb66fa56ffed27c0b27
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WORKER_NAME: victor-telegram-webhook
    steps:
      - name: Generate scoped secrets, bind Worker, emit RSA ciphertext only
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          umask 077
          command_token=$(openssl rand -hex 32)
          command_secret=$(openssl rand -hex 40)
          callback_token=$(openssl rand -hex 32)
          callback_secret=$(openssl rand -hex 40)

          put_secret() {
            local name="$1" value="$2"
            NAME="$name" VALUE="$value" python - <<'PY' > /tmp/cf-secret-payload.json
          import json,os
          print(json.dumps({'name':os.environ['NAME'],'type':'secret_text','text':os.environ['VALUE']}))
          PY
            code=$(curl --silent --show-error --output /tmp/cf-secret.json --write-out '%{http_code}' \
              --request PUT \
              --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              --header 'Content-Type: application/json' \
              --data-binary @/tmp/cf-secret-payload.json \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/secrets")
            python - "$code" "$name" <<'PY'
          import json,sys
          code=int(sys.argv[1]); name=sys.argv[2]; body=json.load(open('/tmp/cf-secret.json'))
          if code not in (200,201) or body.get('success') is not True:
              print(json.dumps({'binding':name,'http_status':code,'errors':body.get('errors',[])},indent=2)); raise SystemExit(1)
          print(f'{name}=stored')
          PY
          }

          put_secret GULABO_HERMES_COMMAND_TOKEN "$command_token"
          put_secret GULABO_HERMES_COMMAND_SECRET "$command_secret"
          put_secret GULABO_HERMES_CALLBACK_TOKEN "$callback_token"
          put_secret GULABO_HERMES_CALLBACK_SECRET "$callback_secret"

          cat > /tmp/gulabo-bootstrap-public.pem <<'PEM'
          -----BEGIN PUBLIC KEY-----
          MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAxcGQ5FLBVMD+2Sp4lgl9
          cA30ntipp4BpogGDiNVc8ukj29NZDJjKtLYo7XiDAxyUONpXDZ4PWMGLZOwnG2/p
          QsyXyI7AikQFDHyy3R35PEB4NZgTKrZOC0p8o9hCRsjQEopxVMjiJ9nDLKjX2lxa
          mCpoIBt62G+toTykt3jPH7Y0suQnzWDXtk3eyJ1E+LbsQ3hvW+ArpI6R8SIZcsHH
          sM724j+XTJp2UiT6lBbb0nVumNaCT4urs3wi8eCR6hxuofe8w31q4Qoufs5bc133
          RjHt8L4h4NHOsXKpKEJ0YaTL4tRXYmd8S7W3C4zSuh1M0vSK8C3qOaMjS3aeWpNG
          JTxHUl1koHTyAwJrBSDIipgwfFNcTIboAA1e0yw4ogqye9UY8x9G/9oIB/QoBIcG
          3cCD+tr/bPwImqE/1Fg0+UkO50p1bDdjaFgqZ5fxhVw/SsufnR5psMWfJxYUskYJ
          BG/mMdjxdhx93KxnkHKJHRsv3MtWTmZn4fqIswjKuGtlAgMBAAE=
          -----END PUBLIC KEY-----
          PEM

          encrypt_one() {
            printf '%s' "$1" | openssl pkeyutl -encrypt -pubin -inkey /tmp/gulabo-bootstrap-public.pem \
              -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 | base64 -w0
          }
          echo "GULABO_COMMAND_TOKEN_RSA_B64=$(encrypt_one "$command_token")"
          echo "GULABO_COMMAND_SECRET_RSA_B64=$(encrypt_one "$command_secret")"
          echo "GULABO_CALLBACK_TOKEN_RSA_B64=$(encrypt_one "$callback_token")"
          echo "GULABO_CALLBACK_SECRET_RSA_B64=$(encrypt_one "$callback_secret")"
          echo 'BOOTSTRAP_STATUS=WORKER_SECRETS_STORED_AND_ORACLE_CIPHERTEXT_READY'
