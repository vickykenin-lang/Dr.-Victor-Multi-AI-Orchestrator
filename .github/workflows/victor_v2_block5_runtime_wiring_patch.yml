name: Victor V2 Block 5 Runtime Wiring Patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/victor_v2_block5_runtime_wiring_patch.yml'
      - 'scripts/v2_block5_runtime_patch.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply deterministic V2 runtime patch
        run: python scripts/v2_block5_runtime_patch.py
      - name: Validate syntax and V2 regression packs
        run: |
          node --check victor-telegram-worker/worker.js
          node --check brain/sandbox_manager.mjs
          node --check brain/capability_broker.mjs
          node --test brain/founder_intent_gateway.test.mjs brain/security_kernel.test.mjs brain/action_contract.test.mjs brain/block3_sandbox_security.test.mjs brain/block4_promotion_shadow.test.mjs brain/block5_redteam_security.test.mjs
      - name: Commit patched runtime and remove one-shot patcher
        run: |
          rm .github/workflows/victor_v2_block5_runtime_wiring_patch.yml
          rm scripts/v2_block5_runtime_patch.py
          git config user.name 'victor-security-ops'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'v2 block 5: wire fail-closed runtime gates into Worker'
          git push origin HEAD:main
