name = "victor-telegram-webhook"
main = "victor-telegram-worker/llm_first_runtime.js"
compatibility_date = "2026-08-27"
keep_vars = true

[version_metadata]
binding = "CF_VERSION_METADATA"

[vars]
COGNEE_SERVICE_URL = "https://tenant-0a6a1d31-b1ae-4ac6-97c2-ca7516939878.aws.cognee.ai"
COGNEE_TENANT_ID = "0a6a1d31-b1ae-4ac6-97c2-ca7516939878"
COGNEE_MEMORY_ENABLED = "true"
RIO_FLYER_TRANSPORT_ENABLED = "false"

[secrets]
required = [ "COGNEE_API_KEY" ]

[[kv_namespaces]]
binding = "VICTOR_CONVERSATION_STATE"

[[kv_namespaces]]
binding = "HERMES_COMMAND_STORE"
id = "7e5b8e59a13e46849e5c926ea2354801"

[[queues.producers]]
binding = "VICTOR_TELEGRAM_QUEUE"
queue = "victor-telegram-ingress"

[[queues.consumers]]
queue = "victor-telegram-ingress"
max_batch_size = 1
max_batch_timeout = 1
max_retries = 3
retry_delay = 10

[triggers]
crons = []

[observability]
enabled = true
head_sampling_rate = 1.0
