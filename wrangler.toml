name = "victor-telegram-webhook"
main = "victor-telegram-worker/worker.js"
compatibility_date = "2026-08-27"
keep_vars = true

[version_metadata]
binding = "CF_VERSION_METADATA"

[[kv_namespaces]]
binding = "VICTOR_CONVERSATION_STATE"

[triggers]
crons = [ "*/15 * * * *", "30 16 * * *" ]

[observability]
enabled = true
head_sampling_rate = 1.0
